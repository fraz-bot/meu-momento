/* onboarding v2 (prints) */

.whl.ln .whb{background:transparent;border-top:1px solid var(--oll);border-bottom:1px solid var(--oll);border-radius:0}
.zz{position:relative;height:440px;width:100%;max-width:358px;margin:0 auto}
.zn{position:absolute;width:0;height:0}.zn>span.cic{position:absolute;left:-23px;top:-23px;background:var(--bg)}
.zn.big>span.cic{width:62px;height:62px;left:-31px;top:-31px}.zn .cic.on{background:var(--ol);color:#fff;border-color:var(--ol)}
.zn>div{position:absolute;top:-20px;width:140px;text-align:left}.zn>div.l{text-align:right}
.zn b{display:block;font-weight:600;font-size:15px}.zn small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.fst2{display:grid;gap:14px;padding:18px!important}.fst2>div{display:flex;gap:14px;align-items:flex-start}
.fst2 .n{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ol);display:grid;place-items:center;font-weight:600;color:var(--ol)}
.fst2 .on .n{background:var(--ol);color:#fff}.fst2 b{display:block;font-weight:600}.fst2 small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.tk{stroke:#E6D3C6;stroke-width:3;stroke-linecap:round}.tk.on{stroke:#5A2E14}
.sheetbg{position:fixed;inset:0;background:rgba(42,26,16,.45);display:flex;align-items:flex-end;z-index:80}
.sheet{width:100%;max-height:92dvh;overflow:auto;background:#E8D5C8;border-radius:28px 28px 0 0;padding:10px 22px 26px}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:#C9AE9E;margin:4px auto 6px}

.ckb.on{background:var(--ol)}
.camx{position:fixed;inset:0;z-index:70;background:#2A1A10;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px)}

.cchip{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 18px;font-size:14px}

.rd{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--oll)}

.srow{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:6px;min-height:84px;padding:0 4px}

.pimg{flex:none;display:grid;place-items:center}
.sbot.want{opacity:.5;filter:grayscale(.35)}
.hpr{display:block;color:var(--terra-ink)!important;font-weight:600}
.sh.gone{opacity:.62}
.pwo-g{display:grid;gap:12px;text-align:left;margin-bottom:6px}
.pwo{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--oll);background:transparent;border-radius:20px;padding:16px;font:inherit;color:var(--ink);cursor:pointer}

.pwo i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--oll)}.pwo.on i{border:6px solid var(--ol);background:#fff}
.pwo>span{text-align:left}.pwo>.pwp2{text-align:right}.pwo b{display:block;font-size:17px;font-weight:600}.pwo small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.pwp2{text-align:right;font-size:19px;font-weight:600}
.pwo em{position:absolute;top:-11px;right:14px;font-style:normal;background:var(--ol);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px}
.btn.fill{background:var(--ol)!important;color:#fff!important;border:0!important}
/* Pellie Ritual */
.rt-home{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.rt-gr h1{margin:0;font-size:clamp(28px,8vw,36px);line-height:1.08;color:#4A2A1E;letter-spacing:-.02em;font-weight:700}.rt-dt{margin:6px 0 0;color:#8A6F62;font-size:15px}.rt-rs{margin:8px 0 0;color:#4A2A1E;font-size:15px;line-height:1.4}

.rt-cta.big{justify-content:flex-start;padding:0 22px;gap:14px;min-height:72px;text-align:left}.rt-cta.big b{display:block;font-size:19px}.rt-cta.big small{display:block;font-weight:500;opacity:.85;font-size:13.5px;margin-top:1px}

.rt-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #F0E3D8;padding-top:12px}.rt-nums b{display:block;font-size:24px;color:#4A2A1E;letter-spacing:-.02em}.rt-nums span{font-size:12.5px;color:#8A6F62;line-height:1.2;display:block}

/* modo ritual (tela cheia) */

.rt-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.rt-pill{background:#F6E3D8;color:#8A4A34;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:800;letter-spacing:.03em}.rt-clk{font-size:14px;color:#4A2A1E;font-weight:500}

.rt-blk h3,.rt-why h3{margin:0 0 4px;display:flex;gap:8px;align-items:center;font-size:16px;color:#4A2A1E}.rt-blk h3 svg{color:#A76F5C}.rt-blk p{margin:0;font-size:15px;line-height:1.4;color:#4A2A1E}
.rt-why{background:#F8EBE2;border-radius:18px;padding:11px 13px}.rt-why h3 svg{color:#A76F5C}.rt-why p{margin:0;font-size:14px;line-height:1.38;color:#6B4A3C}.rt-why small{display:block;margin-top:5px;font-size:11.5px;color:#9A8173}
.rt-tm{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;font:inherit;border:1.5px solid #EBD8CB;border-radius:18px;background:none;padding:8px;color:#4A2A1E}.rt-tm span{color:#A76F5C;display:flex}.rt-tm b{font-size:20px}.rt-tm small{font-size:12.5px;color:#8A6F62}button.rt-tm{cursor:pointer}

:root{--f-display:'Plus Jakarta Sans','Inter','Figtree',system-ui,sans-serif;--bg:#FCF8F2;--line:#EFE2D0;--soft:#F8EBDA;--sh:0 1px 2px rgba(42,20,32,.04),0 10px 30px rgba(42,20,32,.07)}
h1,h2,h3{letter-spacing:-.025em;font-weight:800}
h1{line-height:1.12}h2{font-size:21px}h3{font-size:16.5px;letter-spacing:-.015em}
:root:not([data-tema=suave]) body{background:radial-gradient(85% 34% at 100% 0%,#F6E6D2 0%,transparent 62%),radial-gradient(70% 26% at 0% 4%,#F9EFE2 0%,transparent 60%),var(--bg);background-attachment:fixed}
:root:not([data-tema=suave]) .card,:root:not([data-tema=suave]) .rc,:root:not([data-tema=suave]) .nextc,:root:not([data-tema=suave]) .short button,:root:not([data-tema=suave]) .mrow,:root:not([data-tema=suave]) .tm,:root:not([data-tema=suave]) .doneb{box-shadow:var(--sh);border-color:transparent}
.card{border-radius:24px;padding:20px}
.mrow{border-radius:20px;padding:14px 16px}
.btn{border-radius:999px;min-height:50px;font-weight:700;letter-spacing:-.01em;padding:0 22px}
:root:not([data-tema=suave]) .btn{box-shadow:0 8px 20px rgba(170,128,86,.24)}
.btn.ghost,:root:not([data-tema=suave]) .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.tile{border-radius:14px}
.badge{letter-spacing:.06em;font-weight:700}
.seg button{border-radius:16px;border-color:transparent;box-shadow:var(--sh);font-weight:700}
.rg{border-color:transparent}
.opt{border-radius:18px;border-color:transparent;box-shadow:var(--sh)}
input[type=text]{border-radius:16px;border-width:1.5px}
.step{padding:15px 0}
.pv3 button{border:0;background:var(--surface);box-shadow:var(--sh);border-radius:22px}
.bk2{border-color:transparent;box-shadow:var(--sh)}
.wm{font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;font-size:22px;filter:none}
.wm.big{font-size:34px}
header{padding:16px 0 12px}
.pill{font-weight:800}
.hero2{border:0;border-radius:28px;box-shadow:var(--sh);background:linear-gradient(160deg,#F4E3CD,#FCF7F0)}
.comp,.ptsb,.alertc,.nextc{border-color:transparent!important;box-shadow:var(--sh)}
.comp{border-radius:22px}
.cta{border-radius:24px}
.gcard{background:var(--surface);border-radius:24px;padding:18px 16px 14px;box-shadow:var(--sh)}
.gtt{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
/* ----- cadastro novo ----- */
.obx{gap:18px;padding-top:10px;min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px)}
.obm{justify-content:center}
.obh{font-size:30px;line-height:1.12;letter-spacing:-.03em}
.obs{color:var(--muted);font-size:16px;line-height:1.4;margin:-6px 0 0;text-align:center}
.cam{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.cs{display:flex;gap:14px;align-items:center;text-align:left}.cs b{display:block;font-size:16px;font-family:var(--f-display)}.cs small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.cam .cs{padding:10px 0;position:relative}.cam .cs:not(:last-child)::after{content:"";position:absolute;left:22px;top:58px;height:16px;border-left:2px dotted var(--tint)}
.cic{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--ink)}.cs.on .cic{background:var(--tint)}
.obk{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.bkx{align-self:flex-start;border:0;background:transparent;color:var(--ink);padding:8px 8px 8px 0;cursor:pointer;display:inline-flex}
.obf{margin-top:auto;padding-top:8px;display:flex;justify-content:center;position:sticky;bottom:14px}
.obc{min-width:230px;min-height:56px;font-size:17px}
.btn[disabled]{opacity:.45;box-shadow:none!important}
.obin{text-align:center;font-size:26px!important;font-weight:800;font-family:var(--f-display);background:var(--soft)!important;border:0!important;border-radius:20px!important;padding:20px!important}
.op2{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:2px solid transparent;background:var(--surface);box-shadow:var(--sh);color:var(--ink);border-radius:20px;padding:18px;font:inherit;cursor:pointer}
.op2 b{display:block;font-size:17px;font-family:var(--f-display);letter-spacing:-.01em}.op2 small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.op2 i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--tint)}
.op2[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}.op2[aria-pressed=true] i{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 45%,transparent 50%)}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qg button{border:2px solid transparent;background:var(--surface);box-shadow:var(--sh);border-radius:22px;padding:18px 8px 16px;display:grid;justify-items:center;gap:10px;font:inherit;color:var(--ink);cursor:pointer}
.qg button b{font-weight:600;font-size:15px}.qg button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.fmap{display:block;width:min(100%,340px);height:auto;margin:0 auto}
.fz{fill:#fff;fill-opacity:.01}.fz.on{fill:#D9A066;fill-opacity:.9}
.zch{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.zch button{border:1.5px solid var(--tint);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.zch button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.evo{background:var(--surface);border-radius:24px;padding:16px 14px 14px;box-shadow:var(--sh)}
.evt,.evl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.evl{margin-top:8px}.evl span{display:flex;align-items:center;gap:8px}.evl i{width:22px;height:5px;border-radius:9px;background:var(--accent)}.evl i.d{background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 11px);height:3px}
.whl{position:relative;height:260px;margin:4px 0}
.whb{position:absolute;left:0;right:0;top:104px;height:52px;border-radius:16px;background:var(--soft)}
.wheel{position:relative;height:260px;overflow-y:auto;scroll-snap-type:y mandatory;padding:104px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;outline:0}
.wheel::-webkit-scrollbar{display:none}
.wi{height:52px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted);opacity:.25}
.wi.on{font-size:34px;color:var(--ink);opacity:1}.wi.n1{font-size:27px;opacity:.6}.wi.n2{opacity:.4}
.fring{display:grid;place-items:center}
.fst{display:grid;gap:14px}.fst>div{display:flex;gap:12px;align-items:flex-start}
.fst em{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:var(--grad);color:var(--ongrad);display:grid;place-items:center;font-weight:800;font-size:14px}
.fst b{display:block;font-size:16px}.fst small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.ftp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.ftp div{display:grid;justify-items:center;gap:6px}.ftp span{width:44px;height:44px;border-radius:50%;background:var(--grad);color:var(--ongrad);display:grid;place-items:center}
.mph{width:min(62%,230px);margin:4px auto;border-radius:38px;background:#2C2118;padding:7px;box-shadow:0 24px 46px rgba(170,128,86,.28)}
.mph-s{border-radius:32px;background:linear-gradient(180deg,#F6E6D2 0%,#FBF6EE 46%);padding:26px 10px 12px;position:relative;display:grid;gap:6px;text-align:left}
.mph-n{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:62px;height:14px;border-radius:9px;background:#2C2118}
.mph-h{text-align:center;display:grid;justify-items:center;gap:2px;padding:6px 0 8px}
.mph-h span{font-size:10px;color:var(--ink)}.mph-h b{font-family:var(--f-display);font-size:22px;letter-spacing:-.03em}.mph-h i{font-style:normal;font-size:9.5px;color:var(--muted)}
.mph-h u{text-decoration:none;margin-top:6px;display:inline-flex;align-items:center;gap:4px;background:var(--grad);color:var(--ongrad);font-size:10px;font-weight:700;padding:5px 12px;border-radius:99px}
.mph-r{display:flex;align-items:center;gap:7px;background:#fff;border-radius:12px;padding:7px 8px;box-shadow:0 2px 8px rgba(43,28,20,.06)}
.mph-r em{font-style:normal;flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-size:9px;font-weight:800;display:grid;place-items:center}
.mph-r span{color:var(--accent);display:grid}.mph-r small{display:block;font-size:8.5px;color:var(--muted)}.mph-r b{display:block;font-size:10.5px}
.pwx{display:grid;gap:14px}
.pwp{text-align:center;display:grid;gap:2px}
.pwb{display:flex;align-items:baseline;justify-content:center;gap:4px;color:var(--accent)}.pwb b{font-family:var(--f-display);font-size:46px;letter-spacing:-.04em;line-height:1}.pwb span{font-size:18px;font-weight:700}
.pls{display:grid;gap:12px;margin-top:6px}
.pls button{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:18px 16px;font:inherit;cursor:pointer;text-align:left}
.pls button span{flex:1;font-size:17px;font-weight:600}.pls button b{text-align:right;color:var(--accent);font-size:17px}.pls button small{display:block;font-size:13px;font-weight:600}
.pls i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent)}
.pls button[aria-checked=true]{border-color:var(--accent);background:var(--soft)}.pls button[aria-checked=true] i{background:radial-gradient(circle,var(--accent) 0 45%,transparent 50%)}
.pls em{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-style:normal;background:var(--grad);color:var(--ongrad);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:99px;white-space:nowrap}
.pwm .mph{width:min(46%,170px)}.pwm .mph-r:nth-child(n+6){display:none}
.fhalo{background:radial-gradient(closest-side,var(--tint) 0%,transparent 72%);padding:6px 0}.fhalo .fmap{width:min(72%,250px)}
.f3d{display:grid;place-items:center;min-height:120px}.f3c{display:block;margin:0 auto;touch-action:manipulation}
[data-f3d=tap] .f3c{cursor:pointer}
[data-f3d=tap]{min-height:340px}
.fhalo .f3d{max-width:250px;margin:0 auto}
.fhalo:has(.fimg){background:none}.fhalo .fimg{width:min(100%,280px,calc((100dvh - 520px)/1.25))}
.mleg{display:grid;gap:6px;text-align:left;margin:6px 0 2px}.mleg span{display:flex;gap:8px;align-items:center;font-size:14px}.mleg i{flex:none;width:12px;height:12px;border-radius:50%;background:#B76652}
/* barra de navegação flutuante */
.app{padding-bottom:118px}
nav,:root:not([data-tema=suave]) nav{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:6px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 14px 36px rgba(42,20,32,.16)}
nav button{border-radius:20px;padding:8px 0 7px;font-size:10.5px;font-weight:700;transition:background .18s,color .18s}
nav button[aria-current="page"],:root:not([data-tema=suave]) nav button[aria-current="page"]{background:var(--soft);color:var(--accent)}
@media (prefers-reduced-motion:reduce){nav button{transition:none}}
/* ===== contorno fino, na lógica do logo ===== */
:root{--ol:#5A2E14;--oll:#D9C2AC}
svg.ic{stroke-width:1.5}
.btn,.hpill,.obc{background:transparent!important;color:var(--ol)!important;border:1.5px solid var(--ol)!important;box-shadow:none!important}
.btn.ghost{border-color:var(--oll)!important}
.card,.rc,.nextc,.short button,.mrow,.tm,.doneb,.comp,.ptsb,.alertc,.pv3 button,.op2,.qg button,.opt,.evo,.gcard,.bk2,.seg button,.cnts button{box-shadow:none!important;border:1px solid var(--oll)!important;background:var(--surface)}
.tile,.short .tile,.vb .tile,.vp .tile,.pw .tile,.av,.fst em,.ftp span,.mph-r em{background:transparent!important;color:var(--ol)!important;border:1.3px solid var(--ol)!important;box-shadow:none!important}
.badge,.vbadge,.pls em,.mph-h u,.pill{background:var(--surface)!important;color:var(--ol)!important;border:1px solid var(--ol)!important;box-shadow:none!important}
.hhero,.hero2,.cta.go,.cta,.oferta,.tri,.plus,.tip{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--ol)!important;box-shadow:none!important}
.hhero h2,.hhero h2 em,.hhero .lvrow,.plus h2,.plus .perk,.oferta h3{color:var(--ink)!important}
.hero2::before,.hero2::after{display:none}
.card.oferta .btn,.plus .btn,.cta.go .btn{background:transparent!important;color:var(--ol)!important;box-shadow:none!important}
.oferta .pl>div,.tri3 i{background:transparent!important;border:1px solid var(--oll)}.oferta .pl>div.best{border:1.5px solid var(--ol)!important}
.seg button[aria-pressed="true"],.rg[aria-pressed="true"],.op2[aria-pressed=true],.qg button[aria-pressed=true],.opt[aria-pressed="true"],.zch button[aria-pressed=true],.pls button[aria-checked=true]{background:var(--soft)!important;color:var(--ol)!important;border:1.5px solid var(--ol)!important;box-shadow:none!important}
.rg,.zch button{background:transparent!important;border:1px solid var(--oll)!important;color:var(--ink)}
nav button[aria-current="page"]{background:transparent!important;color:var(--ol)!important;box-shadow:inset 0 0 0 1.3px var(--ol)}
.step.done button.ck,.rr.on .rk,.wd.on i{background:transparent!important;color:var(--ol)!important;border:1.5px solid var(--ol)!important;box-shadow:none!important}
.vsh>span+span,.vsr .yes{background:var(--soft)!important;color:var(--ink)!important}
.bar b,.lvbar b,.use b{background:var(--ol)!important}
.sw[aria-checked="true"]{background:var(--ol)}
h1,h2,h3,.obh{font-weight:700}
.mph{background:transparent;border:1.5px solid var(--ol);box-shadow:none}.mph-n{background:var(--ol)}.mph-s{background:var(--surface)}.mph-r{box-shadow:none;border:1px solid var(--oll)}
.pwb,.pls button b,.kick{color:var(--ol)!important}
/* ===== refinamento v3: luxo minimalista (creme, bege, nude, marrom profundo, terracota discreto) ===== */
:root{
  --bg:#FAF5EF;--surface:#FFFDF9;--ink:#4B2919;--muted:#7A6657;--line:#F0E5D8;
  --ol:#4B2919;--oll:#E7D8C6;--accent:#4B2919;--accent-ink:#FBF6EE;
  --terra:#A76F5C;--terra-soft:#F6E8E1;--terra-ink:#7E4B3A;
  --ok:#4F8A6B;--ok-soft:#E7F0EA;--ok-ink:#2F6A4D;
  --att:#B8623F;--att-soft:#F9E8DE;--att-ink:#8C4426;--att-deep:#9E3B2B;
  --neu-soft:#F2E9DE;
  --sage:#4F8A6B;--warn:#B8623F;--soft:#F4EADF;--tint:#EBDACB;
  --sh:0 1px 2px rgba(75,41,25,.04),0 12px 30px -16px rgba(75,41,25,.16);
}
body{font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.obh{font-weight:700;letter-spacing:-.015em}
h2{font-size:24px;line-height:1.15}h3{font-size:17px}
.obh{font-size:31px;letter-spacing:-.02em}
.lead{font-size:17px}
.small{font-size:14px}.note{font-size:13.5px;line-height:1.45}
.kick,.obk{letter-spacing:.1em;font-size:12px}
.evt,.evl,.exh{letter-spacing:.08em}
.badge{font-size:12px;letter-spacing:.03em}
nav button{font-size:11px}
.stack{gap:16px}
/* botões: principal preenchido, secundário só contorno */
.btn,.obc,.hpill,.cta.go .btn,.card.oferta .btn,.plus .btn{background:var(--ol)!important;color:#FBF6EE!important;border:1.5px solid var(--ol)!important;border-radius:14px;font-weight:600;letter-spacing:.005em;box-shadow:0 8px 18px -10px rgba(75,41,25,.55)!important;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btn:active,.obc:active,.hpill:active{transform:translateY(1px) scale(.995);box-shadow:0 3px 8px -6px rgba(75,41,25,.5)!important}
.btn.ghost,.cta.go .btn.ghost,.card.oferta .btn.ghost,.plus .btn.ghost{background:transparent!important;color:var(--ol)!important;border:1.5px solid var(--ol)!important;box-shadow:none!important}
.btn[disabled],.btn:disabled{background:var(--neu-soft)!important;color:#A8998B!important;border-color:var(--oll)!important;box-shadow:none!important;opacity:1}
.btn svg,.obc svg,.hpill svg{color:inherit}
.hpill{border-radius:999px}
.chip{border:1px solid var(--oll);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px}
/* cards */
.card,.rc,.nextc,.comp,.alertc,.evo,.gcard,.mrow,.hero2,.cta.go,.cta,.tip,.plus,.oferta,.tri,.hhero{background:var(--surface)!important;border:1px solid var(--oll)!important;border-radius:20px;box-shadow:var(--sh)!important;color:var(--ink)!important}
.card{padding:20px}
.hero2{background:linear-gradient(160deg,#FFFDF9 0%,#F6EADF 100%)!important}
.short button,.pv3 button,.cnts button,.ptsb,.doneb,.tm{box-shadow:none!important;border:1px solid var(--oll)!important;background:var(--surface)}
.step{padding:16px 0}
.step,.entry,.sh,.otier,.prr{border-color:var(--line)}
.tile{background:var(--terra-soft)!important;color:var(--terra-ink)!important;border:0!important}
.badge,.vbadge,.pls em,.pill{background:var(--neu-soft)!important;color:var(--ol)!important;border:0!important}
.pls em{background:var(--ol)!important;color:#FBF6EE!important}
/* seleção: cartões e opções grandes em terracota; chips e segmentos preenchidos em marrom */
.op2,.qg button,.qg3 button,.opt,.pls button,.tier{border:1px solid var(--oll)!important;background:var(--surface)!important;color:var(--ink)!important;transition:background .18s,border-color .18s}
.op2[aria-pressed=true],.qg button[aria-pressed=true],.qg3 button[aria-pressed=true],.opt[aria-pressed="true"],.pls button[aria-checked=true],.tier.on,.nextc.now{background:var(--terra-soft)!important;border:1.5px solid var(--terra)!important;color:var(--ink)!important;box-shadow:none!important}
.op2 i,.pls i{border-color:var(--oll)}
.op2[aria-pressed=true] i,.pls button[aria-checked=true] i{border-color:var(--terra);background:radial-gradient(circle,var(--terra) 0 45%,transparent 50%)}
.opt[aria-pressed="true"]::after{border-color:var(--terra);background:var(--terra);box-shadow:inset 0 0 0 4px var(--terra-soft)}
.seg button,.rg,.zch button,.sgm button{background:var(--surface)!important;border:1px solid var(--oll)!important;color:var(--ink)!important;transition:background .18s,color .18s,border-color .18s}
.seg button[aria-pressed="true"],.rg[aria-pressed="true"],.zch button[aria-pressed=true],.sgm button[aria-pressed=true]{background:var(--ol)!important;color:#FBF6EE!important;border:1px solid var(--ol)!important;box-shadow:none!important}
.seg button[aria-pressed="true"] small{color:#E9D9C8;opacity:1}
nav button[aria-current="page"]{background:var(--terra-soft)!important;color:var(--ol)!important;box-shadow:none!important}
nav button[aria-current="page"] svg{color:var(--terra)}
/* concluído = verde suave */
.step.done button.ck,.rr.on .rk{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.step.done .tt{color:var(--muted)}
.wd.on i{background:var(--ol)!important;color:#FBF6EE!important;border-color:var(--ol)!important}
.kick,.obk.att{color:var(--terra-ink)!important}
/* resultados da IA: verde favorável, rosa queimado prioridade, terracota atenção, marrom neutro */
.bar{height:8px;background:var(--neu-soft)}
.bar b{background:var(--ok)!important;transform-origin:left center}
.bar b.md{background:var(--terra)!important}
.bar b.hi{background:var(--att)!important}
.meter .num{color:var(--ink)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.lgd span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.lgd span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.lgd .lgm::before{background:var(--terra)}.lgd .lga::before{background:var(--att)}
.ttl{display:flex;align-items:center;gap:8px}
.ttl::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.ttl.ok{color:var(--ok-ink)}.ttl.att{color:var(--att-ink)}.ttl.pri{color:var(--terra-ink)}.ttl.neu{color:var(--ol)}
.ttl.pri+ol li::marker{color:var(--terra);font-weight:700}
.score{background:var(--surface);border:1px solid var(--oll)}

  return typeof resumo==='string'&&criterios&&typeof criterios==='object'&&Array.isArray(ev)?{resumo,criterios,evitar_encontrados:ev}:null}

const hm=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmtDur=m=>{const h=Math.floor(m/60),mm=m%60;return h?(mm?`${h}h ${mm}min`:`${h}h`):`${Math.max(mm,1)}min`};
const feito=per=>{const ks=getR()[per];return ks.length>0&&ks.every(k=>isDone(per,k))};
function bloq(per){
  if(S.unl&&S.unl[hoje()+per])return 0;
  const n=nowMin(),m=hm(S.rem.m),nt=hm(S.rem.n),T=30,mid=Math.max(m+60,Math.round((m+nt)/2));
  if(per==='m')return n>=m-T&&n<mid?0:(n<m-T?m-T-n:1440-n+m-T);
  return n>=nt-T?0:nt-T-n;
}

}

      S.sosRes={d:hoje(),aspecto:r.aspecto?String(r.aspecto).slice(0,40):'',resumo:r.resumo?String(r.resumo):'',agora:arr(r.agora,4),usar,evitar:arr(r.evitar,3),

    [['m',S.rem.m],['n',S.rem.n]].forEach(([p,h],j)=>{const d=at(i,h);if(d>now)out.push({id:1000+i*2+j,at:d,title:T,body:pick(NMSG[p],i+now.getDate())})})}

function cgCal(){if(!cgReady())return cgSetup();const c=cgInit(),O=cgOrdem(),t0=cgDia0(new Date()),ini=cgIni(),w0=Math.max(0,Math.floor(cgDiff(t0,ini)/7)),pg=S.cgPg||0,A=Math.max(0,w0+pg*6-(pg?0:0)),rows=[];

function cgAct(v){const [a,b,c2]=v.split('|'),y=window.scrollY;
  const go=(x,top=true)=>{S.chv=x||null;S.cgPg=0;render();if(top)window.scrollTo(0,0)};
  if(a==='v'){if(b==='crono'||b==='cal')cgInit();return go(b)}
  if(a==='st'){S.cgs=+b;render();window.scrollTo(0,0);return}
  if(a==='open'){goTab('cabelo');S.chv=b;render();window.scrollTo(0,0);return}
  if(a==='scan'){S.pfArea='cabelo';goTab('escanear');return}
  if(a==='shelf'){goTab('produtos','shelf');S.prodSub='shelf';S.shF='cabelo';render();return}
  if(a==='rot'){S.rit=null;S.tab='rotina';S.rtArea='cabelo';S.rtSub='rot';render();window.scrollTo(0,0);return}
  if(a==='hist'){S.rit=null;S.tab='rotina';S.rtArea='hist';render();window.scrollTo(0,0);return}
  const c=cgInit();
  if(a==='nec'){const n=c.q.nec,i=n.indexOf(b);if(i>=0)n.splice(i,1);else n.push(b);save();render();window.scrollTo(0,y);return}
  if(a==='criar'){if(!c.q.nec.length||!hqOk('lav'))return;S.cgs=0;c.ready=true;S.chv='crono';save();render();window.scrollTo(0,0);return}
  if(a==='done'){c.done[b]=c2;if(b===hoje()){const L=S.hlog||(S.hlog={}),l=L[b]||(L[b]=[]);if(!l.includes('mascara'))l.push('mascara')}save();toast('Tratamento de '+CGT[c2].n.toLowerCase()+' concluído',true);render();window.scrollTo(0,0);return}
  if(a==='tog'){if(c.done[b])delete c.done[b];else c.done[b]=c2;save();render();window.scrollTo(0,y);return}
  if(a==='pg'){S.cgPg=Math.max(0,(S.cgPg||0)+(+b));render();window.scrollTo(0,0);return}
  if(a==='dia'){c.dia=+b;save();render();window.scrollTo(0,y);return}
  if(a==='freq'){c.freq=+b;save();render();window.scrollTo(0,y);return}
  if(a==='ord'){const o=(cgOrdem()||[]).slice();o[+b]=c2;c.custom=o;save();render();window.scrollTo(0,y);return}
  if(a==='reset'){c.custom=null;save();render();window.scrollTo(0,y);return}
  if(a==='notif'){c.notif.on=!c.notif.on;save();render();window.scrollTo(0,y);return}
  if(a==='fin'){const it=S.shelf.find(x=>x.id===b);if(it){if(it.cgf===c2)delete it.cgf;else it.cgf=c2;save();render();window.scrollTo(0,y)}return}

    S.rot={resumo:r.resumo?String(r.resumo):L.resumo,manha:mix(L.manha,r.manha),noite:mix(L.noite,r.noite),semana:r.semana!==undefined?String(r.semana||''):L.semana,d:hoje(),sig:L.sig};
