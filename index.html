/* Layout: app de celular em coluna única (até 520px), navegação inferior com 5 abas.
   Cor: rosa-framboesa para ações, verde para o que está bom, âmbar para atenção. Títulos em serifa suave. */
:root{
  --bg:#FFF2F7; --surface:#FFFFFF; --ink:#2A1420; --muted:#7A5B6B; --line:#F8D3E3;
  --g1:#FF6B9D; --g2:#D6246E; --grad:linear-gradient(145deg,var(--g1),var(--g2)); --accent:#D6246E; --accent-ink:#FFFFFF; --alert:#B3261E; --sage:#2F8A6E; --warn:#B86A06; --soft:#FFE3EE; --tint:#FFC6DD; --hd:#FFFFFF; --hdink:#D6246E;

  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:520px;margin:0 auto;padding-bottom:104px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:22px;letter-spacing:-.01em} h3{font-size:16px}
p{margin:0}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{padding:14px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo{width:32px;height:32px;flex:none}
.tag{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:500;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
.badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600}
.badge.warn{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}

.btn:disabled{background:var(--soft);color:var(--muted);border-color:transparent;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.sr:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.ob{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.ob h1{font-size:32px;letter-spacing:-.02em}
.lead{font-size:17px;color:var(--muted)}
.kick{font-size:13px;color:var(--accent);font-weight:600}
.welcome{border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--tint),var(--soft));padding:8px 8px 0}
.hero{width:120px;height:120px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--accent)}
.hero svg{width:64px;height:80px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:15px;font:inherit;font-weight:600;cursor:pointer}
.opt span{flex:1;min-width:0}
.opt small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.opt::after{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt[aria-pressed="true"]::after{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--soft)}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}

.list{padding-left:18px;margin:6px 0 0;display:flex;flex-direction:column;gap:4px}

.prodhead{display:flex;gap:12px;align-items:flex-start}
.tile{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.pr{text-align:right;flex:none}
.price{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.tier{font:inherit;background:var(--surface);cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:12px;text-align:center;color:var(--muted)}
.tier.on{border-color:var(--accent);background:var(--soft);color:var(--ink)}

.exh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:12px}

.ler{margin-top:12px;font-size:13px;background:var(--soft);border-radius:12px;padding:10px 12px}
details{margin-top:12px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);padding:4px 0}
.otier{padding:10px 0;border-top:1px solid var(--line);font-size:13px}

.total{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px}

label{display:block;font-weight:600;margin:12px 0 4px}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.entry{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.wk{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.chart{width:100%;height:auto;display:block}

.nextc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}

.doneb{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--sage);border-radius:14px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer}.doneb span{flex:1;text-align:left;color:var(--ink)}.doneb .ic:last-child{color:var(--muted)}
.short{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.hhero{background:var(--tint);border-radius:20px;padding:20px}

.total .ic{vertical-align:-4px}
.seg.four{grid-template-columns:repeat(4,1fr);gap:6px}
.seg.four button{font-size:12px;padding:10px 2px;font-weight:600}

.mrow .mt{flex:1;min-width:0}.mrow .mt b{display:block;font-size:15px}.mrow .mt span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

input[type=time]{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 10px}

.pl2{display:flex;flex-direction:column;gap:10px}

.use{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}.use b{display:block;height:100%;background:var(--accent)}
.warn2{border-left:4px solid var(--warn);background:var(--surface);border-radius:12px;padding:12px 14px;border:1px solid var(--line);border-left-width:4px;border-left-color:var(--warn)}

.ta{width:100%;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px;min-height:80px;resize:vertical}
a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}

.comp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--tint);background:var(--surface);color:var(--ink);border-radius:20px;padding:12px 14px;font:inherit;cursor:pointer}
.comp .cx{flex:1;min-width:0;display:grid;gap:6px}.comp .cx b{font-size:14px;line-height:1.25}
.cbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:block}.cbar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.comp .cm{flex:none;display:grid}
.pv{font-size:17px;color:var(--ink)}
.pv3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pv3 button{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--tint);background:transparent;color:var(--accent);border-radius:20px;padding:16px 4px;font:inherit;cursor:pointer;min-width:0}
.pv3 button b{font-size:12.5px;color:var(--ink);text-align:center}
nav button.fab{overflow:visible;background:transparent;position:relative}
nav .fabi{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 0 0 5px var(--surface),0 6px 14px rgba(214,36,110,.28)}
nav button.fab{color:var(--accent);font-weight:700}
nav button.fab[aria-current="page"],:root:not([data-tema=suave]) nav button.fab[aria-current="page"]{background:transparent;color:var(--accent)}
@keyframes fabg{0%,100%{box-shadow:0 0 0 5px var(--surface),0 8px 22px rgba(214,36,110,.45)}50%{box-shadow:0 0 0 5px var(--surface),0 8px 30px rgba(255,107,157,.85)}}
@media (prefers-reduced-motion:reduce){nav .fabi{animation:none}}
.medhead{text-align:center;background:linear-gradient(160deg,#FFE3EE,#FFF8FB);border:1.5px solid var(--tint)}
.pbig{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;color:var(--accent)}
.cmpr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.cmpr div{background:var(--soft);border-radius:16px;padding:12px 4px;display:grid;gap:2px}.cmpr b{font-size:22px;color:var(--accent)}.cmpr span{font-size:11px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.md{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}.md b{font-size:13px}.md span{font-size:11px;color:var(--muted)}
.md.lock{opacity:.75}
.dlist{display:grid;gap:10px;margin-top:10px}.dica{display:grid;gap:2px;border-left:3px solid var(--tint);padding-left:10px}.dica b{font-size:14px}.dica span{font-size:13px;color:var(--muted);line-height:1.4}
.seg.three{grid-template-columns:repeat(3,1fr)}
.wm{font-family:'Pacifico','Snell Roundhand','Brush Script MT','Segoe Script',cursive;font-weight:400;font-size:24px;line-height:1.2;letter-spacing:.01em;background:linear-gradient(100deg,#FF5C9A,#D6246E 60%,#B0125A);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 3px rgba(214,36,110,.22));padding:2px 4px}
.wm.big{font-size:38px}

function rotinaPorAnalise(){
  const rs=S.result;if(!rs)return null;
  const has=k=>S.pref.includes(k),clamp=v=>Math.max(0,Math.min(100,v));
  const o=clamp(rs.oleo+(has('acne')?15:0)),p=clamp(rs.poros+(has('poros')?15:0)),mc=clamp(rs.manchas+(has('manchas')?15:0)),
    l=clamp(rs.linhas+(has('linhas')?15:0)+(S.age==='40'?8:S.age==='50'?12:0)),hd=clamp(rs.hid-(has('resseca')?15:0)),v=clamp(rs.verm+(has('verm')?15:0));
  const forte=S.sens==='alta',sens=forte||S.sens==='media'||rs.tipo==='Sensível',gest=S.gest==='sim',T=55;
  const calm=v>=60||(forte&&v>=45);
  const evita=(S.ing.evitar||[]).join(' ').toLowerCase();
  const barra={vitc:/vitamina c|asc[oó]rbico/,niacina:/niacinamida/,retinol:/retin/,bha:/salic|bha/,hialu:/hialur/};
  const ok=k=>!(barra[k]&&barra[k].test(evita));
  let c=[];
  if(!calm){
    if(mc>=T&&ok('vitc'))c.push({k:'vitc',s:mc});
    if(Math.max(o,p)>=T&&ok('niacina'))c.push({k:'niacina',s:Math.max(o,p)});
    if(!gest&&!forte&&(o>=65||(has('acne')&&o>=50))&&ok('bha'))c.push({k:'bha',s:o});
    if(!gest&&!sens&&l>=T&&ok('retinol'))c.push({k:'retinol',s:l});
    const a=c.find(x=>x.k==='bha'),b=c.find(x=>x.k==='retinol');
    if(a&&b)c=c.filter(x=>x!==(a.s>=b.s?b:a));
    c=c.sort((x,y)=>y.s-x.s).slice(0,forte?2:3);
  }
  const has2=k=>c.some(x=>x.k===k),hialu=(100-hd)>=T&&ok('hialu');
  const M={
    limpador:['',o>=60?'Gel ou espuma, para tirar o excesso de brilho sem agredir.':hd<=45?'Textura cremosa, que não resseca.':'Limpa sem tirar a proteção da pele.'],
    hialu:[STEPS.hialu,`Hidratação em ${hd}/100: o ácido hialurônico puxa água para a pele.`],
    vitc:[STEPS.vitc,`Manchas em ${mc}/100: a vitamina C ajuda a uniformizar o tom e protege do sol.`],
    niacina:[STEPS.niacina,`Oleosidade e poros em ${Math.max(o,p)}/100: ajuda a equilibrar o brilho e a refinar os poros.`],
    bha:[STEPS.bha,`Oleosidade em ${o}/100${has('acne')?' e espinhas':''}: o ácido salicílico limpa por dentro do poro.`],
    retinol:[STEPS.retinol,`Linhas finas em ${l}/100: o retinoide estimula a renovação da pele.`],
    calmante:[STEPS.calmante,`Vermelhidão em ${v}/100: ajuda a acalmar e reforçar a barreira.`],
    hidr:[STEPS.hidr,o>=60?'Prefira textura em gel ou gel-creme, para não pesar.':hd<=45?'Prefira um creme mais rico, com ceramidas.':'Mantém a barreira da pele em dia.'],
    fps:[STEPS.fps,'Protetor solar é o passo que mais protege contra manchas e envelhecimento.']
  };
  const it=k=>({k,como:M[k][0]||STEPS[k]||'',motivo:M[k][1]||''});
  const m=['limpador',...(hialu?['hialu']:[]),...(has2('vitc')?['vitc']:[]),...(has2('niacina')?['niacina']:[]),'hidr','fps'];
  const n=['limpador',...(hialu?['hialu']:[]),...(has2('bha')?['bha']:[]),...(has2('retinol')?['retinol']:[]),...(calm?['calmante']:[]),'hidr'];
  const foco=[[o,'oleosidade'],[p,'poros'],[mc,'manchas'],[l,'linhas finas'],[100-hd,'ressecamento'],[v,'vermelhidão']].filter(x=>x[0]>=T).sort((x,y)=>y[0]-x[0]).slice(0,2).map(x=>x[1]);
  const resumo=(foco.length?`Pela sua análise, o foco é ${foco.join(' e ')}.`:'A sua pele está equilibrada, então a rotina é de manutenção.')+(calm?' Como há vermelhidão, deixei só o essencial e um creme calmante.':'')+(gest?' Sem retinoide e sem ácido salicílico por causa da gestação ou amamentação.':'');

  return{resumo,manha:m.map(it),noite:n.map(it),semana:sem,d:hoje(),sig:rotSig()};
}

  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>no({code:'image_rejected'});im.src=fr.result};fr.onerror=()=>no({code:'image_rejected'});fr.readAsDataURL(f)})}
const sampleP=Promise.resolve({
  limits:async()=>({images:true}),
  async json(prompt,o){
    o=o||{};const corpo={tipo:o.tipo};
    if(o.tipo==='texto')corpo.prompt=prompt;
    else{corpo.contexto=o.ctx||'';const f=Array.isArray(o.images)?o.images[0]:o.images;if(!f)throw {code:'image_rejected'};corpo.imagem=await reduzFoto(f);corpo.media_type='image/jpeg'}
    const {data,error}=await sb.functions.invoke('analisar',{body:corpo});
    if(error){let j=null;try{j=await error.context.json()}catch(e){}
      const cod=j&&j.codigo;if(cod==='plus'||cod==='limite_gratis'){_lastPf=0;atualizaPlano()}throw {code:'srv',msg:(j&&j.erro)||NOMES_ERRO[cod]||'Algo deu errado. Tente de novo.'}}
    if(!data||data.ok!==true)throw {code:'srv',msg:'Algo deu errado. Tente de novo.'};
    return data.resultado;
  }
});

const hm=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmtDur=m=>{const h=Math.floor(m/60),mm=m%60;return h?(mm?`${h}h ${mm}min`:`${h}h`):`${Math.max(mm,1)}min`};
const feito=per=>{const ks=getR()[per];return ks.length>0&&ks.every(k=>isDone(per,k))};
function bloq(per){
  if(S.unl&&S.unl[hoje()+per])return 0;
  const n=nowMin(),m=hm(S.rem.m),nt=hm(S.rem.n),T=30;
  if(per==='m')return n>=m-T&&n<nt?0:(n<m-T?m-n:1440-n+m);
  return n>=nt-T?0:nt-n;
}
function proxCard(){
  const n=nowMin(),m=hm(S.rem.m),nt=hm(S.rem.n),NM={m:'manhã',n:'noite'};
  const open=bloq('m')===0&&!feito('m')?'m':bloq('n')===0&&!feito('n')?'n':null;
  if(open)return `<div class="nextc now"><span class="tile">${ic(open==='m'?'sun':'moon',22)}</span><div class="nt"><span class="small">Hora da rotina</span><b>Rotina da ${NM[open]}</b></div><button class="btn" data-go="rotina|${open}">Começar</button></div>`;
  let per,min;
  if(n<m){per='m';min=m-n}
  else if(n<nt&&!feito('n')){per='n';min=nt-n}
  else{per='m';min=1440-n+m}
  const at=per==='m'?S.rem.m:S.rem.n;
  return `<div class="nextc"><span class="tile">${ic(per==='m'?'sun':'moon',22)}</span><div class="nt"><span class="small muted">Próxima rotina</span><b>Rotina da ${NM[per]} às ${at}</b></div><div class="cd">em ${fmtDur(min)}</div></div>`;
}

function chart(){
  const d=S.diary.slice(-12),W=320,H=170,L=30,B=24,T=10,R_=12;
  const x=i=>L+(d.length===1?0:i*(W-L-R_)/(d.length-1));
  const y=v=>T+(H-T-B)*(1-v/100);
  const line=(key,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${d.map((e,i)=>x(i)+','+y(e[key])).join(' ')}"/>`+
    d.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e[key])}" r="${i===d.length-1?4.5:2.5}" fill="${col}"/>`).join('');
  const last=d[d.length-1],step=Math.ceil(d.length/5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de hidratação e oleosidade">
    ${[0,50,100].map(v=>`<line x1="${L}" x2="${W-R_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('')}
    ${d.map((e,i)=>(i%step===0||i===d.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtD(e.d)}</text>`:'').join('')}
    ${line('oleo','var(--warn)')}${line('hid','var(--sage)')}
    <text x="${x(d.length-1)}" y="${y(last.hid)-9}" text-anchor="end" style="fill:var(--sage);font-weight:700">Hidratação ${last.hid}</text>
    <text x="${x(d.length-1)}" y="${y(last.oleo)-9}" text-anchor="end" style="fill:var(--warn);font-weight:700">Oleosidade ${last.oleo}</text>
  </svg>`;
}

    <button class="btn ghost" data-act="editar-reg" style="margin-top:12px;width:100%">${ic('edit',18)}Editar registro</button></div>`

    <label for="r-hid">Hidratação que você sente: <span id="v-hid">${hojeE?hojeE.hid:50}</span></label><input id="r-hid" type="range" min="0" max="100" value="${hojeE?hojeE.hid:50}">

function hairPlan(r){
  const q=S.hq||{},ct=r.tipo==='Cacheado'||r.tipo==='Crespo',T=55;
  const pr=[],push=(s,t)=>{if(s>=T||t.f)pr.push({s,t:t.t||t})};
  const calorS=q.calor==='sempre',alis=q.quim==='alis',tint=q.quim==='tint';
  const h=r.pontas*.5+r.frizz*.3+(ct?15:0)+(calorS?10:0);
  const n=r.pontas*.4+r.frizz*.3+(r.tipo==='Crespo'?20:r.tipo==='Cacheado'?10:0)-(r.raiz>=70?15:0);
  const rc=r.danos*.6+r.poro*.25+(alis?15:tint?10:0)+(calorS?10:0);
  // prioridades
  const C=[];
  if(r.danos>=T)C.push([r.danos,`Reduzir a quebra (danos em ${r.danos}/100): menos calor e uma máscara de reconstrução a cada 15 dias.`]);
  if(r.pontas>=T)C.push([r.pontas,`Pontas ressecadas (${r.pontas}/100): hidrate e nutria as pontas e corte pontas duplas a cada 3 meses.`.replace('nutria','nutra')]);
  if(r.raiz>=T)C.push([r.raiz,`Raiz oleosa (${r.raiz}/100): lave só a raiz com shampoo e passe o condicionador do meio às pontas.`]);
  if(r.frizz>=T)C.push([r.frizz,`Frizz em ${r.frizz}/100: use leite ou creme de pentear e seque sem esfregar, com toalha de microfibra ou camiseta.`]);
  if(r.poro>=T)C.push([r.poro,`Porosidade alta (${r.poro}/100): finalize com leave-in e use água morna ou fria no último enxágue, para segurar a hidratação.`]);
  if(calorS)C.push([60,'Você usa calor sempre: reduza a frequência e passe protetor térmico antes do secador ou da chapinha.']);
  if(alis)C.push([58,'Cabelo alisado: evite sulfato forte e reforce a hidratação.']);
  if(tint)C.push([57,'Cabelo tingido: use shampoo para cabelos coloridos e proteja do sol para a cor durar.']);

  if(!prior.length)prior.push('Seu cabelo está equilibrado: mantenha limpeza suave, condicionador e uma máscara a cada 15 dias.');
  // cronograma de 4 semanas
  const slots=[null,null,null,null];
  (rc>=55?[1,3]:rc>=35?[2]:[]).forEach(i=>slots[i]='rec');
  let a=h>=n?'hid':'nut',b=a==='hid'?'nut':'hid',alt=0;
  for(let i=0;i<4;i++)if(!slots[i]){slots[i]=alt%2?b:a;alt++}
  const TX={hid:'Hidratação: use a máscara hidratante no lugar do condicionador, 1 vez na semana.',nut:'Nutrição: aplique a máscara nutritiva do meio às pontas, 1 vez na semana.',rec:'Reconstrução: máscara com proteínas, 1 vez só nesta semana, e hidrate bem na lavagem seguinte.'};
  const crono=slots.map((t,i)=>`Semana ${i+1} · ${TX[t]}`);
  const usados=[...new Set(slots)];
  // produtos: cada item nasce das notas da foto e diz o porquê
  const P_=[],nt=(v,l)=>`${l} ${v}/100`;
  // shampoo
  {let b,por;
   if(r.raiz>=70){b='Shampoo de limpeza profunda ou antirresíduo, usado só na raiz; sem óleos pesados.';por=nt(r.raiz,'Raiz muito oleosa')}
   else if(r.raiz>=55){b='Shampoo de limpeza equilibrada para raiz oleosa, sem sulfato forte, só na raiz.';por=nt(r.raiz,'Raiz oleosa')}
   else if(r.danos>=60){b='Shampoo suave com proteínas (queratina, aminoácidos), baixo sulfato.';por=nt(r.danos,'Danos e quebra')}
   else if(r.pontas>=60||ct||alis){b='Shampoo suave, sem sulfato forte (tipo low poo), que não resseca.';por=r.pontas>=60?nt(r.pontas,'Pontas ressecadas'):ct?'Cabelo '+r.tipo.toLowerCase()+' ressecam com facilidade':'Cabelo alisado'}
   else{b='Shampoo neutro de uso regular, equilibrado.';por='Raiz e pontas sem problema forte'}
   if(tint)b+=' De preferência próprio para cabelo colorido.';
   P_.push({k:'shampoo',passo:'Shampoo',busca:b,por});}

  if(r.raiz>=70||(r.poro>=70&&r.danos<50&&r.pontas<70))P_.push({k:'clarif',passo:'Shampoo de limpeza profunda',busca:'Antirresíduo, 1 vez a cada 15 dias, para tirar acúmulo de produto e oleosidade.',por:r.raiz>=70?nt(r.raiz,'Raiz muito oleosa'):nt(r.poro,'Porosidade alta')+', acumula resíduo'});
  // condicionador
  {let b,por;
   if(r.frizz>=65){b='Condicionador anti-frizz, com óleos leves ou silicone solúvel, do meio às pontas.';por=nt(r.frizz,'Frizz')}
   else if(r.danos>=60){b='Condicionador reconstrutor leve, com proteínas, do meio às pontas.';por=nt(r.danos,'Danos e quebra')}
   else if(r.pontas>=60||ct){b='Condicionador cremoso e rico, com óleos ou manteigas, do meio às pontas.';por=r.pontas>=60?nt(r.pontas,'Pontas ressecadas'):'Cabelo '+r.tipo.toLowerCase()+' precisa de mais nutrição'}
   else if(r.raiz>=60){b='Condicionador leve, só do meio às pontas, sem tocar a raiz.';por=nt(r.raiz,'Raiz oleosa')}
   else{b='Condicionador com ação desembaraçante.';por='Cabelo equilibrado'}
   P_.push({k:'cond',passo:'Condicionador',busca:b,por});}
  // máscaras do cronograma
  const MT={hid:'hidratação (glicerina, pantenol, aloe)',nut:'nutrição (óleos e manteigas: argan, karité, coco)',rec:'reconstrução (queratina, aminoácidos)'};
  P_.push({k:'mascara',passo:'Máscara de tratamento',busca:'Tenha '+(usados.length>1?'uma de cada: ':'uma de ')+usados.map(x=>MT[x]).join(' e ')+'.',por:'Seu cronograma de 4 semanas usa '+usados.map(x=>({hid:'hidratação',nut:'nutrição',rec:'reconstrução'}[x])).join(', ').replace(/, ([^,]*)$/,' e $1')});
  // reparador de ligações (dano alto)
  if(r.danos>=70)P_.push({k:'ligacao',passo:'Tratamento reparador de ligações',busca:'Ampola ou máscara com ativos que reconstroem as ligações do fio (bond builder), 1 vez por semana ou a cada 15 dias.',por:nt(r.danos,'Danos e quebra')+', fio frágil'});
  // leave-in
  if(r.frizz>=50||(ct&&r.pontas>=50)||r.poro>=60)P_.push({k:'leave',passo:'Leave-in ou creme de pentear',busca:ct?'Creme de pentear ou leave-in hidratante, aplicado com o cabelo úmido.':r.poro>=60?'Leave-in leve com ativos que selam o fio, aplicado com o cabelo úmido.':'Leave-in leve, só nas pontas, com o cabelo úmido.',por:r.frizz>=50?nt(r.frizz,'Frizz'):r.poro>=60?nt(r.poro,'Porosidade alta'):nt(r.pontas,'Pontas ressecadas')});
  // óleo ou sérum de pontas
  if(r.pontas>=65)P_.push({k:'oleo',passo:'Óleo ou sérum para as pontas',busca:ct?'Óleo vegetal ou sérum nutritivo, 2 gotas só nas pontas, para selar a hidratação.':'Sérum leve para pontas, 1 gota, sem passar na raiz.',por:nt(r.pontas,'Pontas ressecadas')});
  // proteção
  if(q.calor==='sempre'||q.calor==='as')P_.push({k:'termico',passo:'Protetor térmico',busca:'Spray com proteção térmica, antes do secador ou da chapinha.',por:q.calor==='sempre'?'Você usa calor sempre':'Você usa calor às vezes'});
  if(tint||alis)P_.push({k:'solar',passo:'Protetor solar ou de cor para o cabelo',busca:'Spray ou leave-in com filtro UV, para proteger a cor e o fio do sol.',por:tint?'Cabelo tingido':'Cabelo alisado'});

  if(r.raiz>=70)P_.push({k:'esfol',passo:'Esfoliante de couro cabeludo',busca:'Esfoliante suave, 1 vez por semana, para soltar a oleosidade acumulada.',por:nt(r.raiz,'Raiz muito oleosa')});
  return{prior,crono,produtos:P_};
}

/* Análise real: a foto vai para o Claude pela capacidade "sample" do artefato. */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Math.max(0,Math.min(100,Math.round(Number(v)||0)));
const ERR={
  not_granted:'Para analisar a foto, permita que o Claude use o artefato quando o aviso aparecer.',
  rate_limited:'Muitas análises seguidas. Tente de novo em alguns minutos.',
  image_rejected:'Não consegui ler essa imagem. Tente outra foto em JPG ou PNG.',
  images_unavailable:'Aqui não dá para enviar fotos para análise. Abra o link pelo app do Claude.',
  refused:'Não consegui analisar essa foto. Tente outra.',
  invalid_json:'A resposta veio incompleta. Toque em analisar de novo.',
  cancelled:''
};
const promptIA=()=>`Você é uma esteticista que avalia a pele do rosto em uma foto, só para cuidados cosméticos. A pessoa informou: ${perfilBasico()}.
Responda SOMENTE com um JSON.
Se não houver um rosto visível, ou a foto estiver escura, borrada ou com filtro forte, responda {"erro":"frase curta em português pedindo outra foto"}.
Caso contrário, responda neste formato:
{"tipo":"Normal|Mista|Oleosa|Seca|Sensível","resumo":"uma frase em português","oleo":0-100,"hid":0-100,"poros":0-100,"manchas":0-100,"linhas":0-100,"verm":0-100,"prioridades":["3 frases curtas de cuidado, em português"],"atencao":null ou "uma frase, só se algo na foto merecer avaliação de um dermatologista"}
Significado das notas: oleo = brilho e oleosidade; hid = hidratação (alto é bom); poros = quanto aparecem; manchas; linhas = linhas finas; verm = vermelhidão.
Não faça diagnóstico, não cite doenças, não tente identificar a pessoa. Seja realista e prudente: uma foto não substitui avaliação presencial.`;
async function analisar(){
  if(!S.file||S.analyzing)return;
  if(!podeUsar('an'))return limite();
  S.analyzing=true;S.err=null;render();
  const sf=await sampleP;
  if(!sf){S.err='A análise da foto só funciona dentro do Claude. Abra o link pelo app ou pelo claude.ai.';S.analyzing=false;render();return}
  let ok=false;
  try{
    const caps=await sf.limits().catch(()=>null);
    if(!caps||!caps.images)throw {code:'images_unavailable'};
    const r=await sf.json(promptIA(),{tipo:'pele',ctx:perfilBasico(),images:S.file});
    if(!r||r.erro){S.err=(r&&r.erro)||'Não consegui ler a foto. Tente outra.'}
    else{S.result={d:hoje(),tipo:String(r.tipo||'Normal'),resumo:r.resumo?String(r.resumo):'',oleo:num(r.oleo),hid:num(r.hid),poros:num(r.poros),manchas:num(r.manchas),linhas:num(r.linhas),verm:num(r.verm),
      prioridades:(Array.isArray(r.prioridades)?r.prioridades:[]).slice(0,3).map(String),atencao:r.atencao?String(r.atencao):null};ok=true;S.analises=[...S.analises.filter(a=>a.d!==S.result.d),{...S.result}].slice(-30);S.nAn++;uso().an++;xp(50,'Análise concluída','an');if(S.photo)addFoto(S.photo,true)}
  }catch(e){const c=e&&e.code;S.err=c==='srv'?e.msg:(c in ERR?ERR[c]:'Algo deu errado. Toque em analisar de novo.')}
  S.analyzing=false;gameCheck();render();
  if(ok)montarRotina();
}
const promptRot=L=>`Você é uma esteticista. Escreva os textos da rotina de cuidados do rosto de ${S.nome}. Perfil: ${perfilTxt()}. Resultado da análise da foto: tipo ${S.result.tipo}; ${S.result.resumo}. Prioridades: ${S.result.prioridades.join(' | ')}.
Os produtos JÁ FORAM ESCOLHIDOS pelas notas da análise. Não adicione, não remova e não troque nenhum. Manhã: ${L.manha.map(x=>x.k).join(', ')}. Noite: ${L.noite.map(x=>x.k).join(', ')}.
Chaves: limpador, vitc (vitamina C), niacina (niacinamida), retinol (retinoide), bha (ácido salicílico), hialu (ácido hialurônico), calmante (creme calmante), hidr (hidratante), fps (protetor solar).
Para cada produto escreva "como" (instrução curta de uso) e "motivo" (por que serve a esta pele, citando a nota ou o incômodo da pessoa, em uma frase).
Responda SOMENTE com um JSON neste formato:
{"resumo":"1 a 2 frases dirigidas a ${S.nome}, em português","manha":[{"k":"chave","como":"...","motivo":"..."}],"noite":[{"k":"chave","como":"...","motivo":"..."}],"semana":"uma frase sobre a frequência dos ativos ao longo da semana, ou vazio"}
Não faça diagnóstico. Seja prudente.`;
async function montarRotina(){
  if(!S.result||S.rotBusy)return;
  const L=rotinaPorAnalise();S.rot=L;S.rotErr=null;S.rotBusy=true;render();
  const sf=await sampleP;
  try{
    if(!sf)throw {code:'images_unavailable'};
    const r=await sf.json(promptRot(L),{tipo:'texto'});
    const txt=(arr,k)=>{const x=(Array.isArray(arr)?arr:[]).find(y=>y&&y.k===k);return x||{}};
    const mix=(base,ai)=>base.map(b=>{const a=txt(ai,b.k);return{k:b.k,como:a.como?String(a.como):b.como,motivo:a.motivo?String(a.motivo):b.motivo}});
    S.rot={resumo:r.resumo?String(r.resumo):L.resumo,manha:mix(L.manha,r.manha),noite:mix(L.noite,r.noite),semana:r.semana!==undefined?String(r.semana||''):L.semana,d:hoje(),sig:L.sig};
  }catch(e){/* mantém a rotina montada pelas regras, que já usa as notas da análise */}
  S.rotBusy=false;gameCheck();render();
}
function perfilTxt(){
  const rs=S.result;
  const rot=routineKeys().map(k=>P[k].n).join(', ');
  return `${perfilBasico()}${rs?`; tipo de pele ${rs.tipo}; notas de 0 a 100: oleosidade ${rs.oleo}, hidratação ${rs.hid} (alto é bom), poros ${rs.poros}, manchas ${rs.manchas}, linhas finas ${rs.linhas}, vermelhidão ${rs.verm}`:''}${S.gest==='sim'?'; está grávida, tentando engravidar ou amamentando (avise sobre retinoides e outros ativos não indicados)':''}${S.ing.evitar.length?'; ingredientes que ela evita ou tem alergia: '+S.ing.evitar.join(', '):''}${S.ing.fav.length?'; ingredientes favoritos: '+S.ing.fav.join(', '):''}; rotina atual no app: ${rot}`;
}
const promptProd=()=>`Você é uma esteticista que avalia se um produto de cuidados com a pele combina com uma pessoa. Perfil da pessoa: ${perfilTxt()}.
A imagem mostra a embalagem de um produto, frente e/ou lista de ingredientes. Leia o que estiver legível: nome, tipo, ativos e ingredientes. O rótulo pode estar em coreano, japonês ou outro idioma: leia, traduza os ingredientes para o português e avalie normalmente.
Responda SOMENTE com um JSON.
Se a imagem não mostrar um produto de skincare, ou não der para ler nada útil, responda {"erro":"frase curta em português pedindo outra foto, de preferência do rótulo com os ingredientes"}.
Caso contrário, use este formato:
{"produto":"nome como aparece, ou null","categoria":"limpador|sérum|hidratante|protetor solar|esfoliante|máscara|outro","veredito":"serve|cuidado|evitar","nota":0-100,"ativos":["até 4 ativos principais"],"motivos":["até 3 motivos a favor, em português"],"cuidados":["até 3 pontos de atenção em português, incluindo misturas problemáticas com a rotina atual"],"uso":"uma frase sobre quando e como encaixar na rotina","evitar_encontrados":["ingredientes da lista de evitar da pessoa que aparecem no rótulo, ou []"],"favoritos_encontrados":["ingredientes favoritos da pessoa que aparecem no rótulo, ou []"],"perfis":["até 3 tipos de pele ou condições para os quais combina, como Mista, Acneica, Sensível"],"lista_lida":true ou false}
Use lista_lida true só se leu a lista de ingredientes. Se não leu, avalie pelo tipo e pelo que o rótulo diz e deixe isso claro em cuidados.
Não faça diagnóstico e não prometa resultado. Se houver ativos fortes (retinoide, ácidos), lembre de introduzir aos poucos e usar protetor solar. Seja prudente.`;
function thumb(url,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  let u='';try{u=c.toDataURL('image/jpeg',.8)}catch(e){}cb(u)};im.onerror=()=>cb('');im.src=url}
function addFoto(url,silent){
  thumb(url,u=>{
    if(!u)return toast('Não consegui guardar a foto');
    S.fotos=S.fotos.filter(f=>f.d!==hoje());S.fotos.push({d:hoje(),img:u});
    while(S.fotos.length>16)S.fotos.splice(1,1);
    let ok=false;
    for(let i=0;i<4&&!ok;i++){try{const o={};SAVED.forEach(k=>o[k]=S[k]);localStorage.setItem(KEY,JSON.stringify(o));ok=true}catch(e){if(S.fotos.length>2)S.fotos.splice(1,1);else break}}
    xp(10,'Foto guardada','ft');gameCheck();render();
    if(!silent||!ok)toast(ok?'Foto guardada neste aparelho':'Sem espaço para guardar a foto');
  });
}
function guardarFoto(){if(!S.photo)return toast('Tire uma foto primeiro');addFoto(S.photo)}
async function analisarProduto(){
  if(!S.prodFile||S.prodBusy)return;
  if(!podeUsar('sc'))return limite();
  S.prodBusy=true;S.prodErr=null;render();
  const sf=await sampleP;
  try{
    if(!sf)throw {code:'images_unavailable'};
    const caps=await sf.limits().catch(()=>null);
    if(!caps||!caps.images)throw {code:'images_unavailable'};
    const r=await sf.json(promptProd(),{tipo:'produto',ctx:perfilTxt(),images:S.prodFile});
    if(!r||r.erro){S.prodErr=(r&&r.erro)||'Não consegui ler o rótulo. Tente outra foto.'}
    else{
      const arr=a=>(Array.isArray(a)?a:[]).slice(0,4).map(String);
      S.prodResult={produto:r.produto?String(r.produto):null,categoria:String(r.categoria||''),veredito:['serve','cuidado','evitar'].includes(r.veredito)?r.veredito:'cuidado',
        nota:num(r.nota),ativos:arr(r.ativos),motivos:arr(r.motivos),cuidados:arr(r.cuidados),uso:r.uso?String(r.uso):'',perfis:arr(r.perfis).slice(0,3),evitar:arr(r.evitar_encontrados),favs:arr(r.favoritos_encontrados),lista_lida:r.lista_lida!==false};
      S.prods=[{d:hoje(),produto:S.prodResult.produto,veredito:S.prodResult.veredito,nota:S.prodResult.nota},...S.prods].slice(0,8);
      uso().sc++;xp(15,'Produto escaneado','sc');
    }
  }catch(e){const c=e&&e.code;S.prodErr=c==='srv'?e.msg:(c in ERR?ERR[c]:'Algo deu errado. Toque em analisar de novo.')}
  S.prodBusy=false;gameCheck();render();
}
