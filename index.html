/* ===== refinamento v3: luxo minimalista (creme, bege, nude, marrom profundo, terracota discreto) ===== */
:root{
  --bg:#FAF5EF;--surface:#FFFDF9;--ink:#4B2919;--muted:#7A6657;--line:#F0E5D8;
  --ol:#4B2919;--oll:#E7D8C6;--accent:#4B2919;--accent-ink:#FBF6EE;
  --terra:#A76F5C;--terra-soft:#F6E8E1;--terra-ink:#7E4B3A;
  --ok:#4F8A6B;--ok-soft:#E7F0EA;--ok-ink:#2F6A4D;
  --att:#B8623F;--att-soft:#F9E8DE;--att-ink:#8C4426;--att-deep:#9E3B2B;
  --neu-soft:#F2E9DE;
  --sage:#4F8A6B;--warn:#B8623F;--soft:#F4EADF;--tint:#EBDACB;
  --sh:0 1px 2px rgba(75,41,25,.04),0 12px 30px -16px rgba(75,41,25,.16);
}
body{font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.obh{font-weight:700;letter-spacing:-.015em}
h2{font-size:24px;line-height:1.15}h3{font-size:17px}
.obh{font-size:31px;letter-spacing:-.02em}
.lead{font-size:17px}
.small{font-size:14px}.note{font-size:13.5px;line-height:1.45}
.kick,.obk{letter-spacing:.1em;font-size:12px}
.evt,.evl,.exh{letter-spacing:.08em}
.badge{font-size:12px;letter-spacing:.03em}
nav button{font-size:11px}
.stack{gap:16px}
/* botões: principal preenchido, secundário só contorno */
.btn,.obc,.hpill,.cta.go .btn,.card.oferta .btn,.plus .btn{background:var(--ol)!important;color:#FBF6EE!important;border:1.5px solid var(--ol)!important;border-radius:14px;font-weight:600;letter-spacing:.005em;box-shadow:0 8px 18px -10px rgba(75,41,25,.55)!important;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btn:active,.obc:active,.hpill:active{transform:translateY(1px) scale(.995);box-shadow:0 3px 8px -6px rgba(75,41,25,.5)!important}
.btn.ghost,.cta.go .btn.ghost,.card.oferta .btn.ghost,.plus .btn.ghost{background:transparent!important;color:var(--ol)!important;border:1.5px solid var(--ol)!important;box-shadow:none!important}
.btn[disabled],.btn:disabled{background:var(--neu-soft)!important;color:#A8998B!important;border-color:var(--oll)!important;box-shadow:none!important;opacity:1}
.btn svg,.obc svg,.hpill svg{color:inherit}
.hpill{border-radius:999px}
.chip{border:1px solid var(--oll);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px}
/* cards */
.card,.rc,.nextc,.comp,.alertc,.evo,.gcard,.mrow,.hero2,.cta.go,.cta,.tip,.plus,.oferta,.tri,.hhero{background:var(--surface)!important;border:1px solid var(--oll)!important;border-radius:20px;box-shadow:var(--sh)!important;color:var(--ink)!important}
.card{padding:20px}
.hero2{background:linear-gradient(160deg,#FFFDF9 0%,#F6EADF 100%)!important}
.short button,.pv3 button,.cnts button,.ptsb,.doneb,.tm{box-shadow:none!important;border:1px solid var(--oll)!important;background:var(--surface)}
.step{padding:16px 0}
.step,.entry,.sh,.otier,.prr{border-color:var(--line)}
.tile{background:var(--terra-soft)!important;color:var(--terra-ink)!important;border:0!important}
.badge,.vbadge,.pls em,.pill{background:var(--neu-soft)!important;color:var(--ol)!important;border:0!important}
.pls em{background:var(--ol)!important;color:#FBF6EE!important}
/* seleção: cartões e opções grandes em terracota; chips e segmentos preenchidos em marrom */
.op2,.qg button,.qg3 button,.opt,.pls button,.tier{border:1px solid var(--oll)!important;background:var(--surface)!important;color:var(--ink)!important;transition:background .18s,border-color .18s}
.op2[aria-pressed=true],.qg button[aria-pressed=true],.qg3 button[aria-pressed=true],.opt[aria-pressed="true"],.pls button[aria-checked=true],.tier.on,.nextc.now{background:var(--terra-soft)!important;border:1.5px solid var(--terra)!important;color:var(--ink)!important;box-shadow:none!important}
.op2 i,.pls i{border-color:var(--oll)}
.op2[aria-pressed=true] i,.pls button[aria-checked=true] i{border-color:var(--terra);background:radial-gradient(circle,var(--terra) 0 45%,transparent 50%)}
.opt[aria-pressed="true"]::after{border-color:var(--terra);background:var(--terra);box-shadow:inset 0 0 0 4px var(--terra-soft)}
.seg button,.rg,.zch button,.sgm button{background:var(--surface)!important;border:1px solid var(--oll)!important;color:var(--ink)!important;transition:background .18s,color .18s,border-color .18s}
.seg button[aria-pressed="true"],.rg[aria-pressed="true"],.zch button[aria-pressed=true],.sgm button[aria-pressed=true]{background:var(--ol)!important;color:#FBF6EE!important;border:1px solid var(--ol)!important;box-shadow:none!important}
.seg button[aria-pressed="true"] small{color:#E9D9C8;opacity:1}
nav button[aria-current="page"]{background:var(--terra-soft)!important;color:var(--ol)!important;box-shadow:none!important}
nav button[aria-current="page"] svg{color:var(--terra)}
/* concluído = verde suave */
.step.done button.ck,.rr.on .rk{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.step.done .tt{color:var(--muted)}
.wd.on i{background:var(--ol)!important;color:#FBF6EE!important;border-color:var(--ol)!important}
.kick,.obk.att{color:var(--terra-ink)!important}
/* resultados da IA: verde favorável, rosa queimado prioridade, terracota atenção, marrom neutro */
.bar{height:8px;background:var(--neu-soft)}
.bar b{background:var(--ok)!important;transform-origin:left center}
.bar b.md{background:var(--terra)!important}
.bar b.hi{background:var(--att)!important}
.meter .num{color:var(--ink)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.lgd span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.lgd span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.lgd .lgm::before{background:var(--terra)}.lgd .lga::before{background:var(--att)}
.ttl{display:flex;align-items:center;gap:8px}
.ttl::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.ttl.ok{color:var(--ok-ink)}.ttl.att{color:var(--att-ink)}.ttl.pri{color:var(--terra-ink)}.ttl.neu{color:var(--ol)}
.ttl.pri+ol li::marker{color:var(--terra);font-weight:700}
.score{background:var(--surface);border:1px solid var(--oll)}
.score.ok .sn{background:var(--ok)}.score.cuidado .sn{background:var(--att)}.score.evitar .sn{background:var(--att-deep)}
.score.ok{background:var(--ok-soft)}.score.cuidado{background:var(--att-soft)}.score.evitar{background:#F6E1DA}
.verd.ok{color:var(--ok-ink)}.verd.cuidado{color:var(--att-ink)}.verd.evitar{color:var(--att-deep)}
.sh .sn2.ok{background:var(--ok)}.sh .sn2.cuidado{background:var(--att)}.sh .sn2.evitar{background:var(--att-deep)}
.chips span{color:var(--ok-ink);background:var(--ok-soft);border-color:transparent}
.cic.ok{border-color:var(--ok)!important;color:var(--ok)!important}.obk.ok{color:var(--ok-ink)!important}
.pillo{border-color:var(--att);color:var(--att-ink);background:var(--att-soft)}
.alertc svg{color:var(--att)}
.scan{background:var(--terra);box-shadow:0 0 14px rgba(167,111,92,.7)}
/* scanner facial */
.scr{position:relative}
.scr::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(167,111,92,.18),transparent 74%);animation:breathe 3.4s ease-in-out infinite}
.scr svg{position:relative}
#scarc{transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 5px rgba(167,111,92,.45))}
.scspin{transform-origin:130px 130px;animation:spin 22s linear infinite}
.scn{z-index:1}.scn b{font-size:64px;color:var(--ol)}
.scst{font-size:16px;color:var(--terra-ink);font-weight:600;min-height:24px;margin:2px 0 0;animation:fadein .5s ease both}
.dots i{background:var(--terra);transition:opacity .3s}
.camring .tk.on{stroke:#E8B8A3}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.8}50%{transform:scale(1.04);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* transições discretas entre telas e indicadores */
#view.vin{position:relative;animation:vin .36s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;top:10px}to{opacity:1;top:0}}
#view.vin .bar b{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
#view.vin .meter:nth-child(3n+1) .bar b{animation-delay:.05s}#view.vin .meter:nth-child(3n+2) .bar b{animation-delay:.13s}#view.vin .meter:nth-child(3n) .bar b{animation-delay:.21s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* botões de texto no rodapé do onboarding (Pular, Tirar outra foto...): centralizados e com área de toque */
.obf .back{align-self:stretch;width:100%;justify-content:center;align-items:center;min-height:56px;margin-top:6px;padding:10px 20px;font-size:17px;font-weight:600;color:var(--ol)!important;background:transparent;border:1.5px solid var(--ol);border-radius:14px}
@media (prefers-reduced-motion:reduce){#view.vin,#view.vin .bar b,.scr::before,.scspin,.scst{animation:none}#scarc{transition:none}}

.dep{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;border-radius:24px;padding:14px;text-align:left}

.mpd-s{position:relative;height:100%;border-radius:calc(var(--mw)*.172);overflow:hidden;container-type:inline-size;background:linear-gradient(180deg,#F3DFCB 0%,#FAF5EF 46%,#FAF5EF 100%);text-align:left}

function rotinaPorAnalise(){
  const rs=S.result;if(!rs)return null;
  const has=k=>S.pref.includes(k),clamp=v=>Math.max(0,Math.min(100,v));
  const o=clamp(rs.oleo+(has('acne')||has('oleo')?15:0)),p=clamp(rs.poros+(has('poros')?15:0)),mc=clamp(rs.manchas+(has('manchas')?15:0)),

  const forte=S.sens==='alta',sens=forte||S.sens==='media'||S.acido==='irr'||rs.tipo==='Sensível',gest=S.gest==='sim',T=55;

  const barra={vitc:/vitamina c|asc[oó]rbico/,niacina:/niacinamida/,retinol:/retin/,bha:/salic|bha/,hialu:/hialur/};
  const ok=k=>!(barra[k]&&barra[k].test(evita));

  if(!calm){
    if(mc>=T&&ok('vitc'))c.push({k:'vitc',s:mc});
    if(Math.max(o,p)>=T&&ok('niacina'))c.push({k:'niacina',s:Math.max(o,p)});
    if(!gest&&!forte&&(o>=65||(has('acne')&&o>=50))&&ok('bha'))c.push({k:'bha',s:o});
    if(!gest&&!sens&&l>=T&&ok('retinol'))c.push({k:'retinol',s:l});
    const a=c.find(x=>x.k==='bha'),b=c.find(x=>x.k==='retinol');

    c=c.sort((x,y)=>y.s-x.s).slice(0,forte?2:3);
  }
  const has2=k=>c.some(x=>x.k===k),hialu=(100-hd)>=T&&ok('hialu');
  const M={
    limpador:['',o>=60?'Gel ou espuma, para tirar o excesso de brilho sem agredir.':hd<=45?'Textura cremosa, que não resseca.':'Limpa sem tirar a proteção da pele.'],

    calmante:[STEPS.calmante,`Vermelhidão em ${v}/100: ajuda a acalmar e reforçar a barreira.`],
    hidr:[STEPS.hidr,o>=60?'Prefira textura em gel ou gel-creme, para não pesar.':hd<=45?'Prefira um creme mais rico, com ceramidas.':'Mantém a barreira da pele em dia.'],
    fps:[STEPS.fps,'Protetor solar é o passo que mais protege contra manchas e envelhecimento.']
  };
  const it=k=>({k,como:M[k][0]||STEPS[k]||'',motivo:M[k][1]||''});
  const m=['limpador',...(hialu?['hialu']:[]),...(has2('vitc')?['vitc']:[]),...(has2('niacina')?['niacina']:[]),'hidr','fps'];
  const n=['limpador',...(hialu?['hialu']:[]),...(has2('bha')?['bha']:[]),...(has2('retinol')?['retinol']:[]),...(calm?['calmante']:[]),'hidr'];
  const foco=[[o,'oleosidade'],[p,'poros'],[mc,'manchas'],[l,'linhas finas'],[100-hd,'ressecamento'],[v,'vermelhidão']].filter(x=>x[0]>=T).sort((x,y)=>y[0]-x[0]).slice(0,2).map(x=>x[1]);
  const resumo=(foco.length?`Pela sua análise, o foco é ${foco.join(' e ')}.`:'A sua pele está equilibrada, então a rotina é de manutenção.')+(calm?' Como há vermelhidão, deixei só o essencial e um creme calmante.':'')+(gest?' Sem retinoide e sem ácido salicílico por causa da gestação ou amamentação.':'');

    ${fora.length?`<p class="small muted" style="margin-top:${meus.length?12:6}px">Toque para usar na rotina da ${nm}:</p><div class="regg" style="gap:6px;margin-top:6px">${fora.map(i=>`<button class="rg" style="font-size:13px" data-shrot="${i.id}|${per}">+ ${esc(i.n)}</button>`).join('')}</div>`
      :temP().length?'':`<p class="small muted" style="margin-top:6px">Guarde um produto na prateleira para usar aqui na sua rotina.</p>`}
    ${temP().length?'':`<button class="btn ghost" data-go="escanear" style="margin-top:10px;width:100%">${ic('scan',18)}Escanear um produto</button>`}
    ${meus.length?`<p class="note" style="margin-top:10px">Produtos que você adicionou. Eles não mudam os passos indicados pela análise.</p>`:''}</div>`}
/* ---------- Tratamentos específicos, montados pelo scanner facial ---------- */
function tratamentos(){
  const rs=S.result;if(!rs)return null;
  const has=k=>S.pref.includes(k),cl=v=>Math.max(0,Math.min(100,v)),T=55;
  const o=cl(rs.oleo+(has('acne')||has('oleo')?15:0)),p=cl(rs.poros+(has('poros')?15:0)),mc=cl(rs.manchas+(has('manchas')?15:0)),
    l=cl(rs.linhas+(has('linhas')?15:0)+(S.age==='40'?8:S.age==='50'?12:0)),hd=cl(rs.hid-(has('resseca')?15:0)),v=cl(rs.verm+(has('verm')?15:0));
  const forte=S.sens==='alta',sens=forte||S.sens==='media'||S.acido==='irr'||rs.tipo==='Sensível',gest=['sim','tent','amam','grav'].includes(S.gest);
  const calm=v>=60||(forte&&v>=45),evita=(S.ing&&S.ing.evitar||[]).join(' ').toLowerCase();
  const ok=re=>!re.test(evita);
  const reg=k=>{const a=(rs.zonas&&Array.isArray(rs.zonas[k])?rs.zonas[k]:[]).map(x=>(ZONAS.find(q=>q[0]===x)||[0,''])[1]).filter(Boolean);return a.length?' · '+a.join(', '):''};
  const L=[];
  if(calm||v>=45)L.push({id:'verm',pr:calm?200:v,ttl:'Acalmar a pele',alvo:`Vermelhidão ${v}/100${reg('verm')}`,per:'Manhã e noite',prazo:'2 a 4 semanas',
    passos:['Pause ácidos e retinoide por 2 semanas, até a pele acalmar.','Limpe com água morna (não quente), sem esfregar.','Use creme com pantenol, centella ou ceramidas, sem fragrância.','Só volte aos ativos um de cada vez, a cada 1 semana.'],
    cuidado:'Vermelhidão com ardor, carocinhos ou que vai e volta pode ser rosácea ou dermatite: vale consultar um dermatologista.'});
  if(mc>=T)L.push({id:'mc',pr:mc,ttl:'Uniformizar as manchas',alvo:`Manchas ${mc}/100${reg('manchas')}`,per:'Manhã e noite',prazo:'8 a 12 semanas',
    passos:[...(!calm&&ok(/vitamina c|asc[oó]rbico/)?['Manhã: sérum de vitamina C (10 a 20%) no rosto limpo.']:[]),
      ...(ok(/azel/)?['Noite: ácido azelaico 10% em camada fina, nas áreas manchadas.']:['Noite: niacinamida 5% no rosto todo.']),
      'Todo dia: protetor FPS 50+, reaplicado a cada 2 a 3 horas se você estiver ao sol. Sem isso, nenhum clareador funciona.'],
    cuidado:'Mancha que cresce, sangra, tem borda irregular ou muda de cor: procure um dermatologista.'+(gest?' Evite hidroquinona sem orientação médica.':'')});
  if(!calm&&(o>=60||(has('acne')&&o>=45))){const bha=!gest&&!forte&&ok(/salic|bha/);
    L.push({id:'acne',pr:o,ttl:has('acne')?'Controlar acne e oleosidade':'Controlar a oleosidade',alvo:`Oleosidade ${o}/100`,per:'Manhã e noite',prazo:'6 a 8 semanas',noites:2,ativo:bha?'Ácido salicílico (BHA)':'Ácido azelaico',
      passos:[bha?'Noite: ácido salicílico (BHA) 2%, em 2 noites por semana. Se não irritar, suba para 3.':'Noite: ácido azelaico 10%, em camada fina, 2 noites por semana. Suba aos poucos.',
        'Manhã: niacinamida 5% para equilibrar o brilho.',...(has('acne')?['Espinha pontual: adesivo hidrocoloide. Não esprema.']:[]),'Não use dois ativos fortes na mesma noite.'],
      cuidado:'Acne com nódulos dolorosos, cicatrizes ou sem melhora em 8 semanas: consulte um dermatologista.'})}
  if(!calm&&p>=60&&!(o>=60))L.push({id:'poros',pr:p,ttl:'Refinar os poros',alvo:`Poros ${p}/100${reg('poros')}`,per:'Manhã e noite',prazo:'8 semanas',
    passos:['Niacinamida 5%, de manhã ou à noite, no rosto seco.','Limpeza suave todo dia, sem esfregar.','Argila 1 vez por semana, só na zona T.'],
    cuidado:'Poros não fecham: o tratamento melhora o aspecto, e a genética conta.'});
  if(!calm&&l>=T){const ret=!gest&&!sens&&ok(/retin/);
    L.push({id:'linhas',pr:l,ttl:ret?'Suavizar linhas finas':'Linhas finas, sem irritar',alvo:`Linhas finas ${l}/100`,per:'Noite',prazo:'12 semanas',noites:2,ativo:ret?'Retinoide':'Peptídeos',
      passos:ret?['Noite: retinoide do tamanho de uma ervilha, em pele seca, 2 noites por semana por 2 semanas.','Depois 3 noites, e por fim noites alternadas.','Se arder, passe hidratante antes e depois (método sanduíche).','De manhã, protetor FPS 50+ sempre.']
        :['Noite: sérum com peptídeos ou bakuchiol, em 2 noites por semana, subindo aos poucos.','Hidratante rico por cima.','De manhã, protetor FPS 50+ sempre.'],
      cuidado:gest?'Retinoide não pode na gestação nem na amamentação: aqui entra uma alternativa suave.':ret?'Pode descamar nas 2 primeiras semanas. Sem protetor solar, o retinoide piora as manchas.':'Como sua pele é sensível, o retinoide fica para depois.'})}
  if(hd<=45||has('resseca'))L.push({id:'hid',pr:100-hd,ttl:'Hidratação profunda',alvo:`Hidratação ${rs.hid}/100`,per:'Manhã e noite',prazo:'1 a 2 semanas',
    passos:['Ácido hialurônico na pele ainda úmida, depois o creme com ceramidas.','À noite, camada generosa de creme, nas áreas mais secas.','Máscara hidratante 1 vez por semana.','Banho e rosto com água morna, nunca quente.'],
    cuidado:'Pele que descama e coça sem melhorar em 2 semanas: consulte um dermatologista.'});
  if(has('olheiras')||(S.zonas||[]).includes('olhos'))L.push({id:'olho',pr:52,ttl:'Cuidar das olheiras',alvo:'Região dos olhos',per:'Manhã',prazo:'4 a 8 semanas',
    passos:['Contorno dos olhos com cafeína ou vitamina K, de manhã, geladinho da geladeira.','Protetor solar até o osso da órbita.','Dormir 7 a 8 horas e beber água ajuda de verdade.'],
    cuidado:'Olheiras escuras costumam ser genéticas, e cosmético só clareia um pouco.'});
  if(has('textura'))L.push({id:'tex',pr:50,ttl:'Alisar a textura',alvo:'Textura irregular',per:'Noite, 1 vez por semana',prazo:'4 semanas',semanal:'Esfoliação suave',
    passos:['Domingo à noite: esfoliante com ácido mandélico ou lático (5 a 10%), 10 minutos e enxágue.','Não use no mesmo dia que BHA ou retinoide.','Hidratante por cima, sempre.'],
    cuidado:gest?'Na gestação ou amamentação, converse com seu médico antes de esfoliar.':'Pele sensível: comece com 1 vez a cada 15 dias.'});
  if(S.sol==='2'||S.sol==='3')L.push({id:'sol',pr:48,ttl:'Reforçar a proteção solar',alvo:S.sol==='3'?'Mais de 3 horas de sol por dia':'1 a 3 horas de sol por dia',per:'Manhã',prazo:'Desde o 1º dia',
    passos:['FPS 50+ resistente à água, 2 dedos de produto no rosto e pescoço.','Reaplique a cada 2 a 3 horas.','Boné ou chapéu e sombra nas horas de pico.'],cuidado:'Protetor passado de manhã não dura o dia todo.'});
  L.sort((a,b)=>b.pr-a.pr);
  // BHA e retinoide não entram juntos (mesma regra da rotina): fica o de maior nota
  {const a=L.find(x=>x.ativo&&/salic/.test(x.ativo)),b=L.find(x=>x.ativo==='Retinoide');if(a&&b)L.splice(L.indexOf(a.pr>=b.pr?b:a),1)}
  const lista=L.slice(0,calm?3:4);
  // cronograma semanal das noites com ativo
  const ativos=lista.filter(x=>x.noites),extra=lista.find(x=>x.semanal)||(!calm&&p>=60?{semanal:'Argila na zona T'}:null)||(hd<=45?{semanal:'Máscara hidratante'}:null);
  const D=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],sem=D.map(d=>({d,t:'Só hidratar e descansar',c:'r'}));
  if(ativos[0]){sem[0]={d:'Seg',t:ativos[0].ativo,c:'a'};sem[3]={d:'Qui',t:ativos[0].ativo,c:'a'}}
  if(ativos[1]){sem[1]={d:'Ter',t:ativos[1].ativo,c:'b'};sem[4]={d:'Sex',t:ativos[1].ativo,c:'b'}}
  if(extra)sem[6]={d:'Dom',t:extra.semanal,c:'e'};
  return{lista,sem:ativos.length||extra?sem:null,calm}}
function tratRot(per){
  const X=tratamentos();if(!X||!X.lista.length)return '';
  const mostra=X.lista.filter(t=>per==='m'?/Manhã/.test(t.per):/Noite|Manhã e noite/.test(t.per));
  if(!mostra.length&&!(per==='n'&&X.sem))return '';

  const cron=per==='n'&&X.sem?`<div class="trs"><h4>Suas noites da semana</h4><div class="trg">${X.sem.map(s=>`<div class="${s.c}"><small>${s.d}</small><b>${esc(s.t)}</b></div>`).join('')}</div><p class="small muted">Manhã, todo dia: limpar, hidratar e protetor solar.</p></div>`:'';
  return `<div class="card trw0"><div class="row" style="justify-content:space-between"><h3>Tratamentos para o seu rosto</h3><span class="badge">Pela sua análise</span></div>
    <p class="small muted" style="margin:6px 0 10px">${X.calm?'Sua pele está sensível agora, então o foco é acalmar antes de tratar.':'Escolhidos pelas notas do scanner facial, do mais importante para o menos.'}</p>
    ${mostra.map(card).join('')}${cron}
    <p class="small muted" style="margin:10px 0 0">Orientações gerais, que não substituem a avaliação de um dermatologista.</p></div>`}
function viewRotina(){

    :`<div class="card"><h2>Sua rotina</h2>${R_.nota.map(n=>`<p class="note">${esc(n)}</p>`).join('')}
      ${S.rotBusy?'<p class="note">Montando a sua rotina com a análise…</p>':S.result?`<button class="btn" data-act="montar-rotina" style="margin-top:12px;width:100%">${ic('sparkle')}Montar minha rotina</button>`
        :`<button class="btn" data-go="pele|analise" style="margin-top:12px;width:100%">${ic('face')}Personalizar com a foto</button>`}
      ${S.rotErr?`<p class="note" role="alert" style="color:var(--alert)">${esc(S.rotErr)}</p>`:''}</div>`;

function chart(){
  const d=S.diary.slice(-12),W=320,H=170,L=30,B=24,T=10,R_=12;
  const x=i=>L+(d.length===1?0:i*(W-L-R_)/(d.length-1));
  const y=v=>T+(H-T-B)*(1-v/100);
  const line=(key,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${d.map((e,i)=>x(i)+','+y(e[key])).join(' ')}"/>`+
    d.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e[key])}" r="${i===d.length-1?4.5:2.5}" fill="${col}"/>`).join('');
  const last=d[d.length-1],step=Math.ceil(d.length/5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de hidratação e oleosidade">
    ${[0,50,100].map(v=>`<line x1="${L}" x2="${W-R_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('')}
    ${d.map((e,i)=>(i%step===0||i===d.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtD(e.d)}</text>`:'').join('')}
    ${line('oleo','var(--warn)')}${line('hid','var(--sage)')}
    <text x="${x(d.length-1)}" y="${y(last.hid)-9}" text-anchor="end" style="fill:var(--sage);font-weight:700">Hidratação ${last.hid}</text>
    <text x="${x(d.length-1)}" y="${y(last.oleo)-9}" text-anchor="end" style="fill:var(--warn);font-weight:700">Oleosidade ${last.oleo}</text>
  </svg>`;
}

async function analisarSos(){
  if(!S.sosFile||S.sosBusy)return;
  if(!podeUsar('sos'))return limite();
  if(sosHoje()>=3){S.sosErr='Você já usou o Resgate da Pele 3 vezes hoje. Tente de novo amanhã.';render();return}
  S.sosBusy=true;S.sosErr=null;render();
  const sf=await sampleP;
  try{
    if(!sf)throw {code:'images_unavailable'};
    const tem=temP().slice(0,12);
    const ctx=(perfilBasico()+(S.gest==='sim'?'; está grávida, tentando engravidar ou amamentando':'')+(S.ing.evitar.length?'; evita ou tem alergia a: '+S.ing.evitar.join(', '):'')+'; produtos que TEM em casa: '+(tem.length?tem.map(i=>i.n).join(' | '):'nenhum informado')).slice(0,1900);
    const r=await sf.json('',{tipo:'espinha',ctx,images:S.sosFile});
    if(!r||r.erro){S.sosErr=(r&&r.erro)||'Não consegui ler a foto. Tente outra, mais perto e com boa luz.'}
    else{
      const arr=(a,m)=>(Array.isArray(a)?a:[]).slice(0,m).map(String).filter(Boolean);
      const norm=t=>String(t||'').toLowerCase().replace(/\s+/g,' ').trim();
      const usar=(Array.isArray(r.usar)?r.usar:[]).map(u=>{const it=tem.find(i=>norm(i.n)===norm(u&&u.produto))||tem.find(i=>norm(u&&u.produto)&&(norm(i.n).includes(norm(u.produto))||norm(u.produto).includes(norm(i.n))));return it&&u.como?{it,como:String(u.como)}:null}).filter(Boolean).slice(0,3);
      S.sosRes={d:hoje(),aspecto:r.aspecto?String(r.aspecto).slice(0,40):'',resumo:r.resumo?String(r.resumo):'',agora:arr(r.agora,4),usar,evitar:arr(r.evitar,3),
        acompanhar:(Array.isArray(r.acompanhar)?r.acompanhar:[]).slice(0,3).map(a=>({quando:String(a&&a.quando||''),o_que:String(a&&a.o_que||'')})).filter(a=>a.quando&&a.o_que),
        faltou:r.faltou?String(r.faltou):null,medico:r.medico?String(r.medico):null};
      S.sosHist=[{ts:Date.now(),d:hoje(),aspecto:S.sosRes.aspecto},...(S.sosHist||[])].slice(0,10);
    }
  }catch(e){const c=e&&e.code;S.sosErr=c==='srv'?e.msg:(c in ERR?ERR[c]:'Algo deu errado. Toque em ver de novo.')}
  S.sosBusy=false;render();window.scrollTo(0,0);
}

function notifPlan(){
  if(!S.notif||!S.notif.on||!S.ob.done)return [];
  const out=[],now=new Date(),pick=(a,i)=>a[i%a.length],T='Pellie';
  const at=(dias,hhmm)=>{const [h,mi]=String(hhmm).split(':').map(Number),d=new Date(now);d.setDate(d.getDate()+dias);d.setHours(h||0,mi||0,0,0);return d};
  if(ntOn('rot')&&S.plus&&S.result)for(let i=0;i<14;i++){
    [['m',S.rem.m],['n',S.rem.n]].forEach(([p,h],j)=>{const d=at(i,h);if(d>now)out.push({id:1000+i*2+j,at:d,title:T,body:pick(NMSG[p],i+now.getDate())})})}
  if(ntOn('seq')&&S.plus&&S.result&&streak()>=2){const [h,mi]=String(S.rem.n).split(':').map(Number),d=at(0,(h+1>23?23:h+1)+':'+(mi||0));const l=S.log[hoje()]||{};if(d>now&&!l.nOk)out.push({id:2000,at:d,title:T,body:NMSG.seq[0]})}
  if(ntOn('volta'))[3,7,14].forEach((n,i)=>out.push({id:3000+i,at:at(n,'19:00'),title:T,body:NMSG.volta[n][0]}));
  if(ntOn('val')&&S.plus){const v=temP().map(i=>shelfInfo(i).dias).filter(x=>x>7&&x<=21).sort((a,b)=>a-b)[0];if(v!=null)out.push({id:4000,at:at(v-7,'10:00'),title:T,body:NMSG.val[0]})}
  if(ntOn('foto')&&S.plus&&S.result&&S.result.d){const d0=new Date(S.result.d+'T10:00:00'),d=new Date(d0);d.setDate(d.getDate()+30);if(d>now&&(d-now)<14*864e5)out.push({id:5000,at:d,title:T,body:NMSG.foto[0]})}
  return out}

function hairPlan(r){
  const q=S.hq||{},ct=r.tipo==='Cacheado'||r.tipo==='Crespo',T=55;
  const cl=v=>Math.max(0,Math.min(100,v));
  // a foto mostra só o dia; o questionário completa o quadro (E = nota ajustada, usada só nas decisões)

  try{

    const r=await sf.json(promptHair(),{tipo:'cabelo',ctx:'faixa de idade '+AGES.find(a=>a[0]===S.age)[1]+(hqTxt()?'; '+hqTxt():''),images:S.hFile});
    if(!r||r.erro){S.hErr=(r&&r.erro)||'Não consegui ler a foto. Tente outra.'}
    else{const arr=a=>Array.isArray(a)?a:[];
      S.hres={d:hoje(),tipo:String(r.tipo||'Liso'),resumo:r.resumo?String(r.resumo):'',raiz:num(r.raiz),pontas:num(r.pontas),poro:num(r.poro),danos:num(r.danos),frizz:num(r.frizz),
        atencao:r.atencao?String(r.atencao):null,marcas:{}};

      xp(40,'Análise do cabelo','hair');S.okMsg='cabelo'}
  }catch(e){const c=e&&e.code;S.hErr=c==='srv'?e.msg:(c in ERR?ERR[c]:'Algo deu errado. Toque em analisar de novo.')}

const promptIA=()=>`Você é uma esteticista que avalia a pele do rosto em uma foto, só para cuidados cosméticos. A pessoa informou: ${perfilBasico()}.
Responda SOMENTE com um JSON.
Se não houver um rosto visível, ou a foto estiver escura, borrada ou com filtro forte, responda {"erro":"frase curta em português pedindo outra foto"}.
Caso contrário, responda neste formato:
{"tipo":"Normal|Mista|Oleosa|Seca|Sensível","resumo":"uma frase em português","oleo":0-100,"hid":0-100,"poros":0-100,"manchas":0-100,"linhas":0-100,"verm":0-100,"prioridades":["3 frases curtas de cuidado, em português"],"atencao":null ou "uma frase, só se algo na foto merecer avaliação de um dermatologista"}
Significado das notas: oleo = brilho e oleosidade; hid = hidratação (alto é bom); poros = quanto aparecem; manchas; linhas = linhas finas; verm = vermelhidão.
Não faça diagnóstico, não cite doenças, não tente identificar a pessoa. Seja realista e prudente: uma foto não substitui avaliação presencial.`;
async function analisar(){
  if(!S.file||S.analyzing)return;
  if(!podeUsar('an'))return limite();
  S.analyzing=true;S.err=null;render();
  const sf=await sampleP;
  if(!sf){S.err='A análise da foto só funciona dentro do Claude. Abra o link pelo app ou pelo claude.ai.';S.analyzing=false;render();return}
  let ok=false;
  try{
    const caps=await sf.limits().catch(()=>null);
    if(!caps||!caps.images)throw {code:'images_unavailable'};
    const r=await sf.json(promptIA(),{tipo:'pele',ctx:perfilBasico(),images:S.file});
    if(!r||r.erro){S.err=(r&&r.erro)||'Não consegui ler a foto. Tente outra.'}
    else{S.result={d:hoje(),tipo:String(r.tipo||'Normal'),resumo:r.resumo?String(r.resumo):'',oleo:num(r.oleo),hid:num(r.hid),poros:num(r.poros),manchas:num(r.manchas),linhas:num(r.linhas),verm:num(r.verm),
      desafio:['oleo','poros','linhas','manchas','verm','resseca'].includes(r.desafio)?r.desafio:null,desafioReg:(Array.isArray(r.desafio_regioes)?r.desafio_regioes:[]).map(String).filter(x=>ZONAS.some(z=>z[0]===x)).slice(0,3),forte:r.ponto_forte?String(r.ponto_forte).slice(0,40):null,prioridades:(Array.isArray(r.prioridades)?r.prioridades:[]).slice(0,3).map(String),atencao:r.atencao?String(r.atencao):null,zonas:(r.zonas&&typeof r.zonas==='object')?{manchas:(Array.isArray(r.zonas.manchas)?r.zonas.manchas:[]).map(String).slice(0,5),verm:(Array.isArray(r.zonas.verm)?r.zonas.verm:[]).map(String).slice(0,5)}:null};ok=true;S.analises=[...S.analises.filter(a=>a.d!==S.result.d),{...S.result}].slice(-30);S.nAn++;uso().an++;xp(50,'Análise concluída','an');if(S.photo)addFoto(S.photo,true)}
  }catch(e){const c=e&&e.code;S.err=c==='srv'?e.msg:(c in ERR?ERR[c]:'Algo deu errado. Toque em analisar de novo.')}
  if(ok)S.okMsg='pele';
  S.analyzing=false;gameCheck();render();
  if(ok){toast('Avaliação da pele concluída');window.scrollTo(0,0);if(S.plus)montarRotina()}
}
const promptRot=L=>`Você é uma esteticista. Escreva os textos da rotina de cuidados do rosto de ${S.nome}. Perfil: ${perfilTxt()}. Resultado da análise da foto: tipo ${S.result.tipo}; ${S.result.resumo}. Prioridades: ${S.result.prioridades.join(' | ')}.
Os produtos JÁ FORAM ESCOLHIDOS pelas notas da análise. Não adicione, não remova e não troque nenhum. Manhã: ${L.manha.map(x=>x.k).join(', ')}. Noite: ${L.noite.map(x=>x.k).join(', ')}.
Chaves: limpador, vitc (vitamina C), niacina (niacinamida), retinol (retinoide), bha (ácido salicílico), hialu (ácido hialurônico), calmante (creme calmante), hidr (hidratante), fps (protetor solar).
Para cada produto escreva "como" (instrução curta de uso) e "motivo" (por que serve a esta pele, citando a nota ou o incômodo da pessoa, em uma frase).
Responda SOMENTE com um JSON neste formato:
{"resumo":"1 a 2 frases dirigidas a ${S.nome}, em português","manha":[{"k":"chave","como":"...","motivo":"..."}],"noite":[{"k":"chave","como":"...","motivo":"..."}],"semana":"uma frase sobre a frequência dos ativos ao longo da semana, ou vazio"}
Não faça diagnóstico. Seja prudente.`;
async function montarRotina(){
  if(!S.result||S.rotBusy)return;
  const L=rotinaPorAnalise();S.rot=L;S.rotErr=null;S.rotBusy=true;render();
  const sf=await sampleP;
  try{
    if(!sf)throw {code:'images_unavailable'};
    const r=await sf.json(promptRot(L),{tipo:'texto'});
    const txt=(arr,k)=>{const x=(Array.isArray(arr)?arr:[]).find(y=>y&&y.k===k);return x||{}};
    const mix=(base,ai)=>base.map(b=>{const a=txt(ai,b.k);return{k:b.k,como:a.como?String(a.como):b.como,motivo:a.motivo?String(a.motivo):b.motivo}});
    S.rot={resumo:r.resumo?String(r.resumo):L.resumo,manha:mix(L.manha,r.manha),noite:mix(L.noite,r.noite),semana:r.semana!==undefined?String(r.semana||''):L.semana,d:hoje(),sig:L.sig};
  }catch(e){/* mantém a rotina montada pelas regras, que já usa as notas da análise */}
  S.rotBusy=false;gameCheck();render();
}
function perfilTxt(){
  const rs=S.result;
  const rot=routineKeys().map(k=>P[k].n).join(', ');
  return `${perfilBasico()}${rs?`; tipo de pele ${rs.tipo}; notas de 0 a 100: oleosidade ${rs.oleo}, hidratação ${rs.hid} (alto é bom), poros ${rs.poros}, manchas ${rs.manchas}, linhas finas ${rs.linhas}, vermelhidão ${rs.verm}`:''}${S.gest==='sim'?'; está grávida, tentando engravidar ou amamentando (avise sobre retinoides e outros ativos não indicados)':''}${S.ing.evitar.length?'; ingredientes que ela evita ou tem alergia: '+S.ing.evitar.join(', '):''}${S.ing.fav.length?'; ingredientes favoritos: '+S.ing.fav.join(', '):''}; rotina atual no app: ${rot}`;
}
const promptProd=()=>`Você é uma esteticista que avalia se um produto de cuidados com a pele combina com uma pessoa. Perfil da pessoa: ${perfilTxt()}.
A imagem mostra a embalagem de um produto, frente e/ou lista de ingredientes. Leia o que estiver legível: nome, tipo, ativos e ingredientes. O rótulo pode estar em coreano, japonês ou outro idioma: leia, traduza os ingredientes para o português e avalie normalmente.
Responda SOMENTE com um JSON.
Se a imagem não mostrar um produto de skincare, ou não der para ler nada útil, responda {"erro":"frase curta em português pedindo outra foto, de preferência do rótulo com os ingredientes"}.
Caso contrário, use este formato:
{"produto":"nome como aparece, ou null","categoria":"limpador|sérum|hidratante|protetor solar|esfoliante|máscara|outro","veredito":"serve|cuidado|evitar","nota":0-100,"ativos":["até 4 ativos principais"],"motivos":["até 3 motivos a favor, em português"],"cuidados":["até 3 pontos de atenção em português, incluindo misturas problemáticas com a rotina atual"],"uso":"uma frase sobre quando e como encaixar na rotina","evitar_encontrados":["ingredientes da lista de evitar da pessoa que aparecem no rótulo, ou []"],"favoritos_encontrados":["ingredientes favoritos da pessoa que aparecem no rótulo, ou []"],"perfis":["até 3 tipos de pele ou condições para os quais combina, como Mista, Acneica, Sensível"],"lista_lida":true ou false}
Use lista_lida true só se leu a lista de ingredientes. Se não leu, avalie pelo tipo e pelo que o rótulo diz e deixe isso claro em cuidados.
Não faça diagnóstico e não prometa resultado. Se houver ativos fortes (retinoide, ácidos), lembre de introduzir aos poucos e usar protetor solar. Seja prudente.`;
function thumb(url,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  let u='';try{u=c.toDataURL('image/jpeg',.8)}catch(e){}cb(u)};im.onerror=()=>cb('');im.src=url}
function addFoto(url,silent){
  thumb(url,u=>{
    if(!u)return toast('Não consegui guardar a foto');
    S.fotos=S.fotos.filter(f=>f.d!==hoje());S.fotos.push({d:hoje(),img:u});
    while(S.fotos.length>16)S.fotos.splice(1,1);
    let ok=false;
    for(let i=0;i<4&&!ok;i++){try{const o={};SAVED.forEach(k=>o[k]=S[k]);localStorage.setItem(KEY,JSON.stringify(o));ok=true}catch(e){if(S.fotos.length>2)S.fotos.splice(1,1);else break}}
    xp(10,'Foto guardada','ft');gameCheck();render();
    if(!silent||!ok)toast(ok?'Foto guardada neste aparelho':'Sem espaço para guardar a foto');
  });
}
function guardarFoto(){if(!S.photo)return toast('Tire uma foto primeiro');addFoto(S.photo)}
